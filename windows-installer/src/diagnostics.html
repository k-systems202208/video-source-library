<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a1f">
<title>スキャン診断 - 自宅動画ライブラリ</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c22;--panel2:#14171c;--line:#303641;--text:#f2f4f7;--muted:#a8b0bd;--accent:#e7b85c;--accent2:#f6d994;--danger:#ef8b8b;--ok:#83cf9a;--warn:#efc36a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,a{font:inherit}.app{max-width:1280px;margin:auto;padding:22px 20px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.top h1{margin:0 0 4px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--panel);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#17130c;font-weight:700}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.metric strong{font-size:11px;color:var(--accent2);display:block;margin-bottom:4px}.metric span{font-size:24px;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--panel);color:var(--text);cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#17130c;font-weight:700}.panel{display:none}.panel.active{display:block}.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px}.candidate{margin-top:10px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}.candidate-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px}.high{color:var(--ok);border-color:var(--ok)}.medium{color:var(--warn);border-color:var(--warn)}.low{color:var(--muted)}.reason{font-size:11px;color:var(--muted);margin-top:5px}.empty,.error{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--muted)}.error{color:var(--danger)}.notice{background:#1e1b14;border:1px solid #594a2b;color:#e7d39e;border-radius:12px;padding:12px;margin:16px 0}.count{font-size:12px;color:var(--muted);margin-left:4px}.orphan-note{color:var(--ok)}@media(max-width:700px){.top{display:block}.actions{margin-top:12px}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>スキャン診断</h1><div class="muted" id="scanInfo">読み込み中…</div></div>
    <div class="actions"><a class="btn" href="/">← ライブラリ</a><a class="btn" href="/api/admin/scan-diagnostics.csv">CSV</a><a class="btn" href="/api/admin/scan-diagnostics.json">JSON</a><button class="btn primary" id="reload">再読込</button></div>
  </div>
  <div class="notice">診断候補は確認用です。MISSING/NEW_FILE候補や曖昧な字幕候補から、ファイル移動・改名・DBパス修正を自動実行しません。字幕の自動紐付けは一意に確定できる安全ルールだけを使用します。「対応動画なし」は登録済みカタログに紐付け先がないことを診断上分離した正常系です。</div>
  <div class="summary" id="summary"></div>
  <div class="tabs">
    <button class="tab active" data-panel="missing">MISSING <span class="count" id="missingCount"></span></button>
    <button class="tab" data-panel="newFiles">NEW_FILE <span class="count" id="newCount"></span></button>
    <button class="tab" data-panel="subtitles">未紐付字幕 <span class="count" id="subtitleCount"></span></button>
    <button class="tab" data-panel="orphan">対応動画なし <span class="count" id="orphanCount"></span></button>
    <button class="tab" data-panel="unsupported">未対応字幕 <span class="count" id="unsupportedCount"></span></button>
    <button class="tab" data-panel="errors">エラー <span class="count" id="errorCount"></span></button>
  </div>
  <div id="message"></div>
  <section class="panel active" id="panel-missing"></section>
  <section class="panel" id="panel-newFiles"></section>
  <section class="panel" id="panel-subtitles"></section>
  <section class="panel" id="panel-orphan"></section>
  <section class="panel" id="panel-unsupported"></section>
  <section class="panel" id="panel-errors"></section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
async function api(path){const r=await fetch(path,{headers:{Accept:'application/json'}});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(data?.error?.message||`HTTP ${r.status}`);return data}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function confidenceBadge(value,score){const v=(value||'LOW').toLowerCase();return el('span',`badge ${v}`,`${value||'LOW'} ${score??''}`.trim())}
function candidate(c){const box=el('div','candidate'),head=el('div','candidate-head');head.append(el('div','path',c.relativePath||'候補なし'),confidenceBadge(c.confidence,c.score));box.append(head);if(c.workTitle)box.append(el('div','meta',[c.workTitle,c.episodeOrType,c.episodeTitle].filter(Boolean).join(' · ')));box.append(el('div','reason',(c.reasons||[]).join(' / ')||'理由なし'));return box}
function empty(text){return el('div','empty',text)}
function orphanReason(value){return value==='NO_REGISTERED_VIDEO_IN_WORK'?'作品に登録動画がありません':value==='SPECIAL_VIDEO_NOT_REGISTERED'?'対応するSP動画が登録されていません':value||'対応動画なし'}
function renderSummary(d){const s=d.summary||{},scan=d.scan||{};const judged=(Number(scan.subtitlesMatched)||0)+(Number(s.orphanSubtitles)||0);$('scanInfo').textContent=scan.runId?`Scan #${scan.runId} · ${scan.completedAt||''} · 動画 ${scan.filesMatched}/${scan.filesFound} · 字幕判定 ${judged}/${scan.subtitlesFound}（紐付 ${scan.subtitlesMatched}・対応動画なし ${s.orphanSubtitles||0}）`:'成功したスキャンがありません';const metrics=[['MISSING',s.missing||0],['NEW_FILE',s.newFiles||0],['未紐付字幕',s.unmatchedSubtitles||0],['対応動画なし',s.orphanSubtitles||0],['未対応字幕',s.unsupportedSubtitles||0],['エラー',s.errors||0],['動画 HIGH候補',s.highConfidenceFileCandidates||0],['字幕 HIGH候補',s.highConfidenceSubtitleCandidates||0]];const root=$('summary');root.replaceChildren();for(const [label,value] of metrics){const m=el('div','metric');m.append(el('strong','',label),el('span','',Number(value).toLocaleString()));root.append(m)}$('missingCount').textContent=`(${s.missing||0})`;$('newCount').textContent=`(${s.newFiles||0})`;$('subtitleCount').textContent=`(${s.unmatchedSubtitles||0})`;$('orphanCount').textContent=`(${s.orphanSubtitles||0})`;$('unsupportedCount').textContent=`(${s.unsupportedSubtitles||0})`;$('errorCount').textContent=`(${s.errors||0})`}
function renderMissing(items){const root=$('panel-missing');root.replaceChildren();if(!items.length){root.append(empty('MISSINGはありません。'));return}for(const x of items){const box=el('div','item');box.append(el('div','path',x.relativePath),el('div','meta',[x.workTitle,x.episodeOrType,x.episodeTitle].filter(Boolean).join(' · ')));if(x.candidates?.length){box.append(el('div','meta','NEW_FILE側の候補'));for(const c of x.candidates)box.append(candidate(c))}else box.append(el('div','meta','候補なし'));root.append(box)}}
function renderNew(items){const root=$('panel-newFiles');root.replaceChildren();if(!items.length){root.append(empty('NEW_FILEはありません。'));return}for(const x of items){const box=el('div','item');box.append(el('div','path',x.relativePath),el('div','meta',`${x.extension||''} · ${x.fileSize?Number(x.fileSize).toLocaleString()+' bytes':'size不明'}`));root.append(box)}}
function renderSubtitles(items){const root=$('panel-subtitles');root.replaceChildren();if(!items.length){root.append(empty('曖昧な未紐付字幕はありません。'));return}for(const x of items){const box=el('div','item');box.append(el('div','path',x.relativePath),el('div','meta',`${x.extension||''} · ${x.language||'言語不明'} · ${x.matchMethod||'UNMATCHED'}`));if(x.candidates?.length){box.append(el('div','meta','動画候補'));for(const c of x.candidates)box.append(candidate(c))}else box.append(el('div','meta','安全に提示できる候補なし'));root.append(box)}}
function renderOrphans(items){const root=$('panel-orphan');root.replaceChildren();if(!items.length){root.append(empty('対応動画なし字幕はありません。'));return}root.append(empty('この字幕は登録済みカタログに対応動画がないため、自動紐付け対象外として正常に残しています。'));for(const x of items){const box=el('div','item');box.append(el('div','path',x.relativePath),el('div','meta orphan-note',[x.workTitle,orphanReason(x.orphanReason)].filter(Boolean).join(' · ')));root.append(box)}}
function renderUnsupported(items){const root=$('panel-unsupported');root.replaceChildren();if(!items.length){root.append(empty('未対応字幕はありません。'));return}root.append(empty('IDX/SUB/SMIは現在のブラウザ字幕対象外です。通常字幕数には含めず、元ファイルも変更しません。'));for(const x of items){const box=el('div','item');box.append(el('div','path',x.relativePath),el('div','meta',`${x.extension||''} · ${x.fileSize?Number(x.fileSize).toLocaleString()+' bytes':'size不明'} · 未対応形式`));root.append(box)}}
function renderErrors(items){const root=$('panel-errors');root.replaceChildren();if(!items.length){root.append(empty('スキャンエラーはありません。'));return}for(const x of items){const box=el('div','item');box.append(el('div','path',x.relativePath||'(全体)'),el('div','meta',x.errorType||'ERROR'),el('div','',x.message||''));root.append(box)}}
async function load(){const msg=$('message');msg.replaceChildren();try{const d=await api('/api/admin/scan-diagnostics');renderSummary(d);renderMissing(d.missing||[]);renderNew(d.newFiles||[]);renderSubtitles(d.unmatchedSubtitles||[]);renderOrphans(d.orphanSubtitles||[]);renderUnsupported(d.unsupportedSubtitles||[]);renderErrors(d.errors||[])}catch(e){msg.replaceChildren(el('div','error',`診断を読み込めませんでした: ${e.message}`))}}
for(const tab of document.querySelectorAll('.tab'))tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===`panel-${tab.dataset.panel}`))};$('reload').onclick=load;load();
</script>
</body>
</html>
