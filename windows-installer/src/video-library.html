<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171a1f"><title>自宅動画ライブラリ</title><style>:root{color-scheme:dark;--bg:#111318;--panel:#191c22;--panel2:#20242c;--line:#303641;--text:#f2f4f7;--muted:#a8b0bd;--accent:#e7b85c;--accent2:#f6d994;--danger:#ef8b8b;--ok:#83cf9a;--radius:14px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{max-width:1240px;margin:0 auto;padding:20px 20px 80px}header{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}.brand h1{margin:0}.brand p{margin:5px 0 0;color:var(--muted)}.header-actions{display:flex;gap:10px;align-items:center}.stats,.scan-status{font-size:12px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:12px}.search,.sort{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:12px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.chip,.ghost,.primary,.group{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--panel);color:var(--text);cursor:pointer}.chip.active,.primary{background:var(--accent);color:#17130c;border-color:var(--accent);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:150px;display:flex;flex-direction:column;cursor:pointer}.badge,.ep-no{font-size:11px;color:var(--accent2)}.card h2{font-size:18px}.source,.meta,.state,.player-note{font-size:12px;color:var(--muted)}.card-foot{display:flex;justify-content:space-between;margin-top:auto;color:var(--muted);font-size:12px}.available,.scan-status.ok{color:var(--ok)}.scan-status.warn{color:var(--accent2)}.load{display:flex;justify-content:center;margin-top:18px}.empty,.error,.notice{padding:18px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--muted)}.error{color:var(--danger)}.detail[hidden],.catalog[hidden]{display:none}.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.credits{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.info{background:#14171c;border-radius:12px;padding:13px}.info strong{display:block;color:var(--accent2);font-size:12px}.groups{display:flex;gap:8px;overflow:auto;margin:20px 0 12px}.group.active{border-color:var(--accent);color:var(--accent2)}.episodes{display:grid;gap:8px}.episode{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer}.video-detail{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#14171c}.player{width:100%;max-height:72vh;background:#000;border-radius:12px;margin-top:14px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.header-actions{width:100%;justify-content:space-between}.toolbar{grid-template-columns:1fr}.credits{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:440px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div class="brand"><h1>自宅動画ライブラリ</h1><p>Video Library Catalog</p></div><div class="header-actions"><div><div class="stats" id="stats">読み込み中...</div><div class="scan-status" id="scanStatus"></div></div><button class="ghost" id="scanButton">再スキャン</button></div></header><main><section class="catalog" id="catalog"><div class="toolbar"><input id="search" class="search" type="search" placeholder="作品名・監督・出演者を検索"><select id="sort" class="sort"><option value="title">作品名順</option><option value="year">年順</option><option value="added">登録順</option></select></div><div class="chips" id="categories"></div><div id="message"></div><div class="grid" id="works"></div><div class="load" id="loadWrap" hidden><button class="primary" id="loadMore">さらに表示</button></div></section><section class="detail" id="detail" hidden><button class="ghost" id="back">← 作品一覧</button><div id="workDetail"></div></section></main></div><script>'use strict';const PAGE=60,state={offset:0,total:0,q:'',category:'',sort:'title',loading:false},$=id=>document.getElementById(id),works=$('works'),message=$('message'),loadWrap=$('loadWrap');function node(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}async function api(p,o={}){const r=await fetch(p,{...o,headers:{Accept:'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok)throw new Error(d?.error?.message||`HTTP ${r.status}`);return d}async function loadStats(){const s=await api('/api/stats');$('stats').textContent=`${s.works}作品 / ${s.videos}動画`;const w=$('categories');w.replaceChildren();const a=node('button','chip active','すべて');a.dataset.category='';w.append(a);for(const c of s.categories){const b=node('button','chip',`${c.name} ${c.workCount}`);b.dataset.category=c.name;w.append(b)}}async function loadScanStatus(){const e=$('scanStatus');try{const s=await api('/api/scan/status');if(!s.videoRootConfigured){e.className='scan-status warn';e.textContent='動画フォルダー未設定';$('scanButton').disabled=true;return}$('scanButton').disabled=false;if(!s.latest){e.textContent='未スキャン';return}const x=s.latest;e.className='scan-status '+(x.status==='SUCCESS'?'ok':'warn');e.textContent=`一致 ${x.filesMatched} / 欠落 ${x.filesMissing} / 新規 ${x.filesNew}`}catch{x.textContent=''}}async function runScan(){const b=$('scanButton');b.disabled=true;b.textContent='スキャン中...';try{await api('/api/scan',{method:'POST'});await Promise.all([loadScanStatus(),loadWorks(true)])}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='再スキャン'}}function card(w){const c=node('article','card');c.append(node('div','badge',w.category));c.append(node('h2','',w.title));c.append(node('div','source',w.sourceTitle&&w.sourceTitle!==w.title?w.sourceTitle:''));const f=node('div','card-foot');f.append(node('span','',w.yearOrPeriod||'年不明'));f.append(node('span',w.availableVideoCount?'available':'',w.availableVideoCount?`${w.availableVideoCount}/${w.videoCount} 利用可`:`${w.videoCount}動画`));c.append(f);c.onclick=()=>location.hash=`#/work/${w.id}`;return c}async function loadWorks(reset=false){if(state.loading)return;state.loading=true;if(reset){state.offset=0;works.replaceChildren()}const p=new URLSearchParams({limit:PAGE,offset:state.offset,sort:state.sort});if(state.q)p.set('q',state.q);if(state.category)p.set('category',state.category);try{const d=await api('/api/works?'+p);state.total=d.total;for(const w of d.items)works.append(card(w));state.offset+=d.items.length;loadWrap.hidden=state.offset>=state.total}catch(e){message.replaceChildren(node('div','error',e.message))}finally{state.loading=false}}async function showWork(id){$('catalog').hidden=true;$('detail').hidden=false;const w=await api(`/api/works/${id}`),r=document.createDocumentFragment(),h=node('div','hero');h.append(node('div','badge',w.category));h.append(node('h2','',w.title));h.append(node('div','meta',`${w.yearOrPeriod||''} · ${w.videoCount}動画`));const cr=node('div','credits');for(const [l,v] of [['監督・演出',w.director],['主な出演・声優',w.cast]]){const x=node('div','info');x.append(node('strong','',l));x.append(node('span','',v||'情報なし'));cr.append(x)}h.append(cr);r.append(h);if(!w.groups.length)r.append(node('div','empty','この作品には登録済み動画がありません。'));else{const g=node('div','groups');w.groups.forEach((x,i)=>{const b=node('button','group'+(i===0?' active':''),`${x.name} (${x.videoCount})`);b.onclick=()=>{document.querySelectorAll('.group').forEach(q=>q.classList.toggle('active',q===b));loadEpisodes(w.id,x.id)};g.append(b)});r.append(g);const ep=node('div','episodes');ep.id='episodes';r.append(ep);const vd=node('div','');vd.id='videoDetail';r.append(vd)}$('workDetail').replaceChildren(r);if(w.groups.length)loadEpisodes(w.id,w.groups[0].id)}async function loadEpisodes(w,g){const e=$('episodes'),d=await api(`/api/works/${w}/videos?groupId=${g}`);e.replaceChildren();for(const v of d.items){const r=node('div','episode');r.append(node('div','ep-no',v.episodeOrType||v.contentType));r.append(node('div','',v.episodeTitle||'タイトル未設定'));r.append(node('div','state'+(v.file.available?' available':''),v.file.available?'再生可能':'ファイルなし'));r.onclick=()=>showVideo(v.id);e.append(r)}}async function showVideo(id){const b=$('videoDetail'),v=await api(`/api/videos/${id}`),d=node('div','video-detail');d.append(node('h3','',`${v.episodeOrType||''} ${v.episodeTitle||''}`.trim()||v.work.title));d.append(node('p','',`${v.group?.name||''} · ${v.contentType} · ${v.file.extension}`));if(v.file.available){const p=document.createElement('video');p.className='player';p.controls=true;p.preload='metadata';p.playsInline=true;p.src=`/video/${v.id}`;d.append(p);d.append(node('div','player-note',v.file.playbackSupport==='DIRECT'?'ブラウザ直接再生対象です。':'この形式はブラウザによって直接再生できない場合があります。'))}else d.append(node('div','notice','動画ファイルが見つかりません。'));b.replaceChildren(d)}function route(){const m=location.hash.match(/^#\/work\/(\d+)$/);if(m){showWork(+m[1]);return}$('detail').hidden=true;$('catalog').hidden=false;if(!works.children.length)loadWorks(true)}let timer;$('search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.q=e.target.value.trim();loadWorks(true)},250)};$('sort').onchange=e=>{state.sort=e.target.value;loadWorks(true)};$('categories').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;state.category=b.dataset.category||'';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));loadWorks(true)};$('loadMore').onclick=()=>loadWorks(false);$('back').onclick=()=>location.hash='#/library';$('scanButton').onclick=runScan;window.onhashchange=route;(async()=>{await Promise.all([loadStats(),loadScanStatus()]);route()})();</script></body></html>
