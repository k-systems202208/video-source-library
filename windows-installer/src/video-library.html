<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a1f">
<title>自宅動画ライブラリ</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111318;--panel:#191c22;--panel2:#20242c;--line:#303641;
  --text:#f2f4f7;--muted:#a8b0bd;--accent:#e7b85c;--accent2:#f6d994;
  --danger:#ef8b8b;--ok:#83cf9a;--radius:14px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}.app{max-width:1240px;margin:0 auto;padding:20px 20px 80px}
header{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:20px}.brand h1{margin:0;font-size:clamp(24px,4vw,38px)}.brand p{margin:5px 0 0;color:var(--muted)}
.stats{font-size:13px;color:var(--muted);text-align:right}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:12px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:12px;outline:none}.search:focus{border-color:var(--accent)}
.sort{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:thin}.chip,.ghost,.primary{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--panel);color:var(--text);cursor:pointer;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#17130c;font-weight:700}.ghost:hover,.chip:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-height:154px;display:flex;flex-direction:column;cursor:pointer;transition:.15s transform,.15s border-color}.card:hover{transform:translateY(-2px);border-color:#596272}.badge{font-size:11px;color:var(--accent2);letter-spacing:.04em}.card h2{font-size:18px;line-height:1.4;margin:8px 0 4px}.source{font-size:12px;color:var(--muted);min-height:18px}.card-foot{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:16px;color:var(--muted);font-size:12px}.available{color:var(--ok)}
.load{display:flex;justify-content:center;margin-top:18px}.primary{background:var(--accent);color:#17130c;border-color:var(--accent);font-weight:700;padding:10px 18px}.empty,.error{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.error{color:var(--danger)}
.detail[hidden],.catalog[hidden]{display:none}.back{margin-bottom:14px}.hero{background:linear-gradient(140deg,#242933,#171a20);border:1px solid var(--line);border-radius:18px;padding:22px}.hero-top{display:flex;gap:16px;justify-content:space-between}.hero h2{font-size:clamp(25px,4vw,38px);margin:5px 0}.meta{color:var(--muted);font-size:13px}.credits{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.info{background:#14171c;border-radius:12px;padding:13px}.info strong{display:block;color:var(--accent2);font-size:12px;margin-bottom:5px}.info span{white-space:pre-wrap;color:#d6dbe3;font-size:14px}
.groups{display:flex;gap:8px;overflow:auto;margin:20px 0 12px;padding-bottom:3px}.group{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}.group.active{border-color:var(--accent);color:var(--accent2)}
.episodes{display:grid;gap:8px}.episode{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer}.episode:hover{border-color:#596272}.ep-no{font-size:12px;color:var(--accent2);font-weight:700}.ep-title{min-width:0}.ep-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ep-title small{display:block;color:var(--muted);margin-top:3px}.state{font-size:11px;color:var(--muted)}.state.ok{color:var(--ok)}
.video-detail{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#14171c}.video-detail h3{margin:0 0 7px}.video-detail p{margin:5px 0;color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.app{padding:15px 13px 70px}header{align-items:start}.stats{display:none}.toolbar{grid-template-columns:1fr}.credits{grid-template-columns:1fr}.episode{grid-template-columns:78px 1fr}.state{grid-column:2}.grid{grid-template-columns:1fr 1fr}.card{min-height:140px;padding:13px}}
@media(max-width:440px){.grid{grid-template-columns:1fr}.card{min-height:130px}.hero{padding:17px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><h1>自宅動画ライブラリ</h1><p>Video Library Catalog</p></div>
  <div class="stats" id="stats">読み込み中...</div>
</header>

<main>
<section class="catalog" id="catalog">
  <div class="toolbar">
    <label><span class="sr">作品を検索</span><input id="search" class="search" type="search" placeholder="作品名・監督・出演者を検索" autocomplete="off"></label>
    <select id="sort" class="sort" aria-label="並び順"><option value="title">作品名順</option><option value="year">年順</option><option value="added">登録順</option></select>
  </div>
  <div class="chips" id="categories" aria-label="カテゴリ"></div>
  <div id="message"></div>
  <div class="grid" id="works"></div>
  <div class="load" id="loadWrap" hidden><button class="primary" id="loadMore">さらに表示</button></div>
</section>

<section class="detail" id="detail" hidden>
  <button class="ghost back" id="back">← 作品一覧</button>
  <div id="workDetail"></div>
</section>
</main>
</div>
<script>
'use strict';
const PAGE=60;
const state={offset:0,total:0,q:'',category:'',sort:'title',loading:false};
const $=id=>document.getElementById(id);
const works=$('works'),message=$('message'),loadWrap=$('loadWrap');
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function api(path){return fetch(path,{headers:{Accept:'application/json'}}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data?.error?.message||`HTTP ${r.status}`);return data})}
function showError(text){message.replaceChildren(node('div','error',text))}
function clearMessage(){message.replaceChildren()}
async function loadStats(){try{const s=await api('/api/stats');$('stats').textContent=`${s.works.toLocaleString()}作品 / ${s.videos.toLocaleString()}動画`;const wrap=$('categories');wrap.replaceChildren();const all=node('button','chip active','すべて');all.dataset.category='';wrap.append(all);for(const c of s.categories){const b=node('button','chip',`${c.name} ${c.workCount}`);b.dataset.category=c.name;wrap.append(b)}}catch(e){$('stats').textContent='統計取得エラー'}}
function workCard(w){const card=node('article','card');card.tabIndex=0;card.setAttribute('role','link');card.append(node('div','badge',w.category));card.append(node('h2','',w.title));card.append(node('div','source',w.sourceTitle&&w.sourceTitle!==w.title?w.sourceTitle:''));const foot=node('div','card-foot');foot.append(node('span','',w.yearOrPeriod||'年不明'));const availability=w.availableVideoCount?`${w.availableVideoCount}/${w.videoCount} 利用可`:`${w.videoCount}動画`;foot.append(node('span',w.availableVideoCount?'available':'',availability));card.append(foot);const open=()=>location.hash=`#/work/${w.id}`;card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});return card}
async function loadWorks(reset=false){if(state.loading)return;state.loading=true;if(reset){state.offset=0;works.replaceChildren()}clearMessage();loadWrap.hidden=true;const p=new URLSearchParams({limit:String(PAGE),offset:String(state.offset),sort:state.sort});if(state.q)p.set('q',state.q);if(state.category)p.set('category',state.category);try{const data=await api('/api/works?'+p);state.total=data.total;for(const w of data.items)works.append(workCard(w));state.offset+=data.items.length;if(state.total===0)message.replaceChildren(node('div','empty','該当する作品はありません。'));loadWrap.hidden=state.offset>=state.total}catch(e){showError(e.message)}finally{state.loading=false}}
function setCategory(category){state.category=category;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.category===category));loadWorks(true)}
async function showWork(id){$('catalog').hidden=true;$('detail').hidden=false;$('workDetail').replaceChildren(node('div','empty','作品情報を読み込み中...'));try{const w=await api(`/api/works/${id}`);const root=document.createDocumentFragment();const hero=node('div','hero');const top=node('div','hero-top');const titleWrap=node('div','');titleWrap.append(node('div','badge',w.category));titleWrap.append(node('h2','',w.title));titleWrap.append(node('div','meta',[w.yearOrPeriod,w.sourceTitle&&w.sourceTitle!==w.title?w.sourceTitle:null,`${w.videoCount}動画`].filter(Boolean).join(' · ')));top.append(titleWrap);hero.append(top);const credits=node('div','credits');for(const [label,value] of [['監督・演出',w.director],['主な出演・声優',w.cast]]){const box=node('div','info');box.append(node('strong','',label));box.append(node('span','',value||'情報なし'));credits.append(box)}hero.append(credits);root.append(hero);if(!w.groups.length){root.append(node('div','empty','この作品には登録済み動画がありません。'))}else{const groups=node('div','groups');w.groups.forEach((g,i)=>{const b=node('button','group'+(i===0?' active':''),`${g.name} (${g.videoCount})`);b.dataset.group=String(g.id);b.addEventListener('click',()=>selectGroup(w.id,g.id,b));groups.append(b)});root.append(groups);const ep=node('div','episodes');ep.id='episodes';root.append(ep);const vd=node('div','');vd.id='videoDetail';root.append(vd)}$('workDetail').replaceChildren(root);if(w.groups.length)await loadEpisodes(w.id,w.groups[0].id)}catch(e){$('workDetail').replaceChildren(node('div','error',e.message))}}
async function selectGroup(workId,groupId,button){document.querySelectorAll('.group').forEach(b=>b.classList.toggle('active',b===button));await loadEpisodes(workId,groupId)}
async function loadEpisodes(workId,groupId){const ep=$('episodes');if(!ep)return;ep.replaceChildren(node('div','empty','エピソードを読み込み中...'));$('videoDetail').replaceChildren();try{const data=await api(`/api/works/${workId}/videos?groupId=${groupId}`);ep.replaceChildren();if(!data.items.length){ep.append(node('div','empty','動画がありません。'));return}for(const v of data.items){const row=node('div','episode');row.tabIndex=0;const label=v.episodeOrType||v.contentType||'動画';row.append(node('div','ep-no',label));const t=node('div','ep-title');t.append(node('strong','',v.episodeTitle||v.work?.title||'タイトル未設定'));t.append(node('small','',[v.contentType,v.file.extension].filter(Boolean).join(' · ')));row.append(t);row.append(node('div','state'+(v.file.available?' ok':''),v.file.available?'利用可能':v.file.playbackSupport==='UNSUPPORTED'?'再生非対応':'未スキャン'));const open=()=>showVideo(v.id);row.addEventListener('click',open);row.addEventListener('keydown',e=>{if(e.key==='Enter'){open()}});ep.append(row)}}catch(e){ep.replaceChildren(node('div','error',e.message))}}
async function showVideo(id){const box=$('videoDetail');if(!box)return;box.replaceChildren(node('div','empty','動画情報を読み込み中...'));try{const v=await api(`/api/videos/${id}`);const d=node('div','video-detail');d.append(node('h3','',`${v.episodeOrType||''} ${v.episodeTitle||''}`.trim()||v.work.title));d.append(node('p','',`${v.group?.name||'グループなし'} · ${v.contentType} · ${v.file.extension}`));d.append(node('p','',v.file.available?'ファイル利用可能':'実ファイルはまだスキャンされていません。'));box.replaceChildren(d);d.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){box.replaceChildren(node('div','error',e.message))}}
function route(){const m=location.hash.match(/^#\/work\/(\d+)$/);if(m){showWork(Number(m[1]));return}$('detail').hidden=true;$('catalog').hidden=false;if(!works.children.length)loadWorks(true)}
let timer;$('search').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{state.q=e.target.value.trim();loadWorks(true)},250)});$('sort').addEventListener('change',e=>{state.sort=e.target.value;loadWorks(true)});$('categories').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)setCategory(b.dataset.category||'')});$('loadMore').addEventListener('click',()=>loadWorks(false));$('back').addEventListener('click',()=>{location.hash='#/library'});window.addEventListener('hashchange',route);
(async()=>{await loadStats();route()})();
</script>
</body>
</html>
