    /* CINEMA_LIBRARY_BASE_DESIGN_V1 */
    :root{
      --bg:#100d0b;--panel:#1b1714;--panel2:#15110f;--line:#4b3b2c;
      --text:#f3ead8;--muted:#b8aa95;--accent:#c59a4a;--accent2:#f1d99a;
      --cinema-red:#6f171b;--cinema-red2:#932a29;--brass:#b88b3e;--cream:#efe2c7;
    }
    html,body{background:radial-gradient(circle at 50% -20%,rgba(111,23,27,.18),transparent 36rem),linear-gradient(180deg,#120f0d 0%,#0d0b0a 100%);color:var(--text)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;z-index:-1;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 5px)}
    .app{max-width:1320px;padding-top:14px}
    header{position:relative;align-items:center;margin-bottom:24px;padding:14px 18px 16px;border:1px solid #58432e;border-radius:6px;background:linear-gradient(180deg,#251b16,#17120f);box-shadow:inset 0 1px rgba(255,255,255,.05),0 12px 30px rgba(0,0,0,.28)}
    header::before,header::after{content:"";position:absolute;left:12px;right:12px;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
    header::before{top:5px}header::after{bottom:5px}
    .brand-kicker{font:600 10px/1.3 Georgia,"Times New Roman",serif;letter-spacing:.24em;color:var(--accent);margin-bottom:4px}
    .brand h1{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;font-size:30px;letter-spacing:.06em;color:var(--cream);text-shadow:0 1px #000}
    .brand-mark{display:inline-grid;place-items:center;color:var(--accent);font-size:.8em;transform:translateY(-1px)}
    .brand p{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:#cab999;letter-spacing:.12em;font-size:12px}
    .search,.sort{background:#14110f;border-color:#59442f;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
    .search:focus,.sort:focus{outline:1px solid var(--accent);border-color:var(--accent)}
    .chip,.ghost,.group,.action,.tag{border-color:#57442f;background:linear-gradient(180deg,#211a15,#17120f);border-radius:5px}
    .chip.active,.primary{background:linear-gradient(180deg,var(--cinema-red2),var(--cinema-red));color:#fff3df;border:1px solid #c99c4e;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,225,164,.12);font-weight:700}
    .ghost:hover,.group:hover,.action:hover,.chip:hover{border-color:var(--accent);color:var(--accent2)}
    .home-strip{margin-bottom:25px;padding-top:3px}
    .home-strip h2{display:flex;align-items:baseline;gap:8px;font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;font-size:19px;letter-spacing:.06em;color:var(--cream);padding-bottom:8px;border-bottom:1px solid #59432e}
    .home-strip h2::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#6f5636,transparent)}
    .home-strip h2 small{font:600 9px/1.2 Georgia,serif;letter-spacing:.18em;color:var(--accent)}
    .section-icon{font-size:9px;color:var(--accent)}
    .mini{background:linear-gradient(145deg,#201914,#15110f);border-color:#4e3d2d;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(196,151,72,.04)}
    .mini:hover,.mini:focus-within{border-color:var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.38),inset 0 0 0 1px rgba(197,154,74,.12)}
    .mini-poster,.mini-poster-fallback{border-right:1px solid #5b442d}
    .grid{gap:17px}
    .card{background:linear-gradient(155deg,#211a15 0%,#171310 72%);border:1px solid #55412e;border-radius:6px;box-shadow:0 7px 20px rgba(0,0,0,.22),inset 0 0 0 1px rgba(218,174,91,.035)}
    .card:hover,.card:focus-within{transform:translateY(-4px);border-color:#ae8240;box-shadow:0 15px 36px rgba(0,0,0,.4),0 0 0 1px rgba(197,154,74,.12)}
    .poster{background:#0c0a09;border-bottom-color:#674c30;padding:7px}
    .poster img,.poster-fallback{border:1px solid #76562f;box-shadow:0 5px 16px rgba(0,0,0,.45)}
    .card-body{padding:13px 15px 16px}
    .card h2{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;color:var(--cream);letter-spacing:.025em}
    .badge,.ep-no{color:#d5a854;letter-spacing:.04em}
    .progress{background:#33291f;border-radius:0}.progress>span{background:linear-gradient(90deg,#7b1c1f,#c29445)}
    .hero{border:1px solid #644a30;border-radius:7px;background:#18130f;box-shadow:0 16px 45px rgba(0,0,0,.32)}

    .hero-poster,.hero-poster-fallback{border-radius:3px;border:1px solid #b18646;box-shadow:0 12px 30px rgba(0,0,0,.58),0 0 0 5px rgba(30,23,17,.86)}
    .hero-body h1,.hero-body h2{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;letter-spacing:.045em;color:#f5e8ce}
    .overview{color:#ded3c1;text-shadow:0 1px 2px #000}
    .credits{border-top-color:#674c30}
    .credit-label{color:#c6b294;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
    .person-link{background:rgba(25,19,15,.84);border-color:#655039;color:#f0d797;border-radius:999px}
    .person-link:hover,.person-link:focus-visible{background:#291d15;border-color:#c59a4a}
    .group.active,.action.on{border-color:#b88b3e;color:#efd898;background:#261d16}
    .episode,.video-detail,.tech-item{border-color:#4e3d2d;border-radius:5px;background:linear-gradient(180deg,#1d1713,#15110f)}
    .player-dialog,.scan-dialog{border-color:#604a33;background:#18130f;border-radius:7px}
    .tmdb-credit{border-top-color:#493829;color:#857967;font-family:Georgia,"Times New Roman",serif;letter-spacing:.04em}
    .available,.scan-status.ok,.watched{color:#91c493}
    @media(max-width:700px){header{padding:13px 14px}.brand h1{font-size:25px}.brand-kicker{font-size:8px}.home-strip h2 small{display:none}.poster{padding:5px}.card-body{padding:11px 12px 14px}}

  </style>

<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-kicker">PRIVATE CINEMA ARCHIVE</div><h1><span class="brand-mark" aria-hidden="true">◉</span> シネマ蔵書館</h1><p>映画で、また会える。</p></div>
    <div class="header-actions"><div><div class="user" id="currentUser"></div><div class="stats" id="stats">読み込み中...</div><div class="scan-status" id="scanStatus"></div></div><button class="ghost" id="scanButton">再スキャン</button></div>
  </header>
  <main>
    <section id="continueSection" class="home-strip" hidden><h2><span class="section-icon" aria-hidden="true">●</span> 上映中 <small>NOW SHOWING</small></h2><div id="continueStrip" class="strip"></div></section>
    <section id="nextSection" class="home-strip" hidden><h2><span class="section-icon" aria-hidden="true">◆</span> 次回上映 <small>COMING SOON</small></h2><div id="nextStrip" class="strip"></div></section>
    <section class="catalog" id="catalog">
      <div class="toolbar"><input id="search" class="search" type="search" placeholder="作品・俳優・監督を検索..."><select id="sort" class="sort"><option value="title">作品名順</option><option value="year">年順</option><option value="added">登録順</option></select></div>
      <div class="chips" id="categories"></div><div id="message"></div><div class="grid" id="works"></div>
      <div class="load" id="loadWrap" hidden><button class="primary" id="loadMore">さらに表示</button></div>
    </section>
    <section class="detail" id="detail" hidden><button class="ghost" id="back">← 作品目録</button><div id="workDetail"></div></section>
  </main>
  <footer class="tmdb-credit">This product uses the TMDB API but is not endorsed or certified by TMDB. · <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a></footer>
</div>
<div class="player-modal" id="playerModal" hidden role="dialog" aria-modal="true" aria-labelledby="playerModalTitle"><div class="player-dialog"><div class="player-dialog-head"><h2 id="playerModalTitle">動画再生</h2><button class="ghost player-close" id="playerClose" aria-label="プレイヤーを閉じる">× 閉じる</button></div><div id="playerContent"></div></div></div>
<div class="scan-modal" id="scanModal" hidden role="dialog" aria-modal="true" aria-labelledby="scanModalTitle">
  <div class="scan-dialog">
    <h2 id="scanModalTitle">再スキャン</h2>
    <div class="scan-phase" id="scanPhase">準備中</div>
    <div class="scan-message" id="scanMessage">スキャンを開始しています…</div>
    <div class="scan-track"><div class="scan-bar indeterminate" id="scanBar"></div></div>
    <div class="scan-progress-line"><span id="scanProgressText">0 / 0</span><span id="scanPercent">0%</span></div>
    <div class="scan-counts">
      <div class="scan-count"><strong>MATCHED</strong><span id="scanMatched">0</span></div>
      <div class="scan-count"><strong>MISSING</strong><span id="scanMissing">0</span></div>
      <div class="scan-count"><strong>NEW_FILE</strong><span id="scanNew">0</span></div>
      <div class="scan-count"><strong>字幕 検出</strong><span id="scanSubtitles">0</span></div>
      <div class="scan-count"><strong>字幕 未紐付</strong><span id="scanSubtitleUnmatched">0</span></div>
      <div class="scan-count"><strong>ffprobe解析</strong><span id="scanProbed">0</span></div>
    </div>
    <div class="scan-current"><strong>現在処理中:</strong><div id="scanCurrentItem">準備中…</div></div>
    <div class="scan-progress-line"><span>経過 <span id="scanElapsed">0:00</span></span><span>推定残り <span id="scanEta">—</span></span></div>
    <div class="scan-error" id="scanError" hidden></div>
    <div class="scan-actions"><button class="ghost" id="scanClose">閉じる（処理は継続）</button></div>
  </div>
</div>
<script>
'use strict';
const PAGE=60,state={offset:0,total:0,q:'',category:'',sort:'title',person:'',loading:false},$=id=>document.getElementById(id),works=$('works'),loadWrap=$('loadWrap');
let scanRunning=false,scanPollTimer=null;
function node(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
async function api(p,o={}){const r=await fetch(p,{...o,headers:{Accept:'application/json',...(o.headers||{})}});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={}}if(!r.ok)throw new Error(d?.error?.message||`HTTP ${r.status}`);return d}
function jo(method,x){return{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}}
function ft(ms){if(!ms)return'0:00';const s=Math.floor(ms/1000),m=Math.floor(s/60),q=s%60;return`${m}:${String(q).padStart(2,'0')}`}
function techValue(v,fallback='未取得'){return v===null||v===undefined||v===''?fallback:String(v)}
function splitCreditPeople(value){const raw=String(value||'').trim();if(!raw)return[];const items=raw.split(/\s*(?:、|,|，|;|；|\||\r?\n|\s+\/\s+)\s*/u).map(x=>x.trim()).filter(Boolean);return[...new Set(items)]}
