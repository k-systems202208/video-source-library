<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171a1f"><title>自宅動画ライブラリ</title><style>:root{color-scheme:dark;--bg:#111318;--panel:#191c22;--line:#303641;--text:#f2f4f7;--muted:#a8b0bd;--accent:#e7b85c;--accent2:#f6d994;--danger:#ef8b8b;--ok:#83cf9a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{max-width:1240px;margin:0 auto;padding:20px 20px 80px}header{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}.brand h1{margin:0}.brand p{margin:5px 0 0;color:var(--muted)}.header-actions{display:flex;gap:10px;align-items:center}.stats,.scan-status,.user{font-size:12px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:12px}.search,.sort{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:12px}.chips,.groups{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.chip,.ghost,.primary,.group,.action{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--panel);color:var(--text);cursor:pointer}.chip.active,.primary{background:var(--accent);color:#17130c;border-color:var(--accent);font-weight:700}.action.on{border-color:var(--accent);color:var(--accent2)}.home-strip{margin:0 0 22px}.home-strip h2{font-size:16px;margin:0 0 10px}.strip{display:flex;gap:10px;overflow:auto}.mini{min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer}.mini strong{display:block}.mini small{color:var(--muted)}.progress{height:5px;background:#303641;border-radius:99px;margin-top:9px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:150px;display:flex;flex-direction:column;cursor:pointer}.badge,.ep-no{font-size:11px;color:var(--accent2)}.card h2{font-size:18px}.source,.meta,.state,.player-note{font-size:12px;color:var(--muted)}.card-foot{display:flex;justify-content:space-between;margin-top:auto;color:var(--muted);font-size:12px}.available,.scan-status.ok,.watched{color:var(--ok)}.load{display:flex;justify-content:center;margin-top:18px}.empty,.error,.notice{padding:18px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--muted)}.error{color:var(--danger)}.detail[hidden],.catalog[hidden],.home-strip[hidden]{display:none}.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.hero-line{display:flex;justify-content:space-between;gap:12px}.hero-actions,.video-actions{display:flex;gap:8px;flex-wrap:wrap}.credits{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.info{background:#14171c;border-radius:12px;padding:13px}.info strong{display:block;color:var(--accent2);font-size:12px}.groups{margin:20px 0 12px}.group.active{border-color:var(--accent);color:var(--accent2)}.episodes{display:grid;gap:8px}.episode{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer}.episode-state{display:flex;gap:6px;font-size:12px}.video-detail{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#14171c}.player{width:100%;max-height:72vh;background:#000;border-radius:12px;margin-top:14px}.resume{margin-top:10px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.header-actions{width:100%;justify-content:space-between}.toolbar{grid-template-columns:1fr}.credits{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.hero-line{display:block}.hero-actions{margin-top:10px}.episode{grid-template-columns:78px 1fr}.episode-state{grid-column:2}}@media(max-width:440px){.grid{grid-template-columns:1fr}.mini{min-width:230px}}</style></head><body><div class="app"><header><div class="brand"><h1>自宅動画ライブラリ</h1><p>Video Library Catalog</p></div><div class="header-actions"><div><div class="user" id="currentUser"></div><div class="stats" id="stats">読み込み中...</div><div class="scan-status" id="scanStatus"></div></div><button class="ghost" id="scanButton">再スキャン</button></div></header><main><section id="continueSection" class="home-strip" hidden><h2>続きから見る</h2><div id="continueStrip" class="strip"></div></section><section id="nextSection" class="home-strip" hidden><h2>次に見る</h2><div id="nextStrip" class="strip"></div></section><section class="catalog" id="catalog"><div class="toolbar"><input id="search" class="search" type="search" placeholder="作品名・監督・出演者を検索"><select id="sort" class="sort"><option value="title">作品名順</option><option value="year">年順</option><option value="added">登録順</option></select></div><div class="chips" id="categories"></div><div id="message"></div><div class="grid" id="works"></div><div class="load" id="loadWrap" hidden><button class="primary" id="loadMore">さらに表示</button></div></section><section class="detail" id="detail" hidden><button class="ghost" id="back">← 作品一覧</button><div id="workDetail"></div></section></main></div><script>'use strict';const PAGE=60,state={offset:0,total:0,q:'',category:'',sort:'title',loading:false},$=id=>document.getElementById(id),works=$('works'),loadWrap=$('loadWrap');function node(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}async function api(p,o={}){const r=await fetch(p,{...o,headers:{Accept:'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok)throw new Error(d?.error?.message||`HTTP ${r.status}`);return d}function jo(method,x){return{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}}function ft(ms){if(!ms)return'0:00';const s=Math.floor(ms/1000),m=Math.floor(s/60),q=s%60;return`${m}:${String(q).padStart(2,'0')}`}async function loadStats(){const s=await api('/api/stats');$('stats').textContent=`${s.works}作品 / ${s.videos}動画`;const w=$('categories');w.replaceChildren();const a=node('button','chip active','すべて');a.dataset.category='';w.append(a);for(const c of s.categories){const b=node('button','chip',`${c.name} ${c.workCount}`);b.dataset.category=c.name;w.append(b)}}async function loadUser(){const r=await api('/api/current-user');$('currentUser').textContent=r.authenticated?`利用者: ${r.user.displayName}`:'匿名利用'}async function loadHome(){try{const [cw,nu]=await Promise.all([api('/api/me/continue-watching'),api('/api/me/next-up')]);renderStrip('continueSection','continueStrip',cw.items,true);renderStrip('nextSection','nextStrip',nu.items,false)}catch(e){console.warn(e)}}function renderStrip(secId,stripId,items,progress){const sec=$(secId),strip=$(stripId);strip.replaceChildren();sec.hidden=!items.length;for(const x of items){const c=node('div','mini');c.append(node('strong','',x.workTitle));c.append(node('small','',[x.groupName,x.episodeOrType,x.episodeTitle].filter(Boolean).join(' · ')));if(progress&&x.percent!==null){const p=node('div','progress'),b=node('span');b.style.width=Math.max(0,Math.min(100,x.percent))+'%';p.append(b);c.append(p);c.append(node('small','',`${ft(x.positionMs)} から再開`))}c.onclick=()=>openInWork(x.workId,x.videoId);strip.append(c)}}async function loadScan(){const e=$('scanStatus');try{const s=await api('/api/scan/status');if(!s.videoRootConfigured){e.textContent='動画フォルダー未設定';$('scanButton').disabled=true;return}$('scanButton').disabled=false;if(!s.latest){e.textContent='未スキャン';return}const x=s.latest;e.textContent=`一致 ${x.filesMatched} / 欠落 ${x.filesMissing} / 新規 ${x.filesNew}`}catch{e.textContent=''}}async function runScan(){const b=$('scanButton');b.disabled=true;try{await api('/api/scan',{method:'POST'});await Promise.all([loadScan(),loadWorks(true)])}catch(e){alert(e.message)}finally{b.disabled=false}}function card(w){const c=node('article','card');c.append(node('div','badge',w.category+(w.favorite?' · ★ お気に入り':'')));c.append(node('h2','',w.title));c.append(node('div','source',w.sourceTitle&&w.sourceTitle!==w.title?w.sourceTitle:''));if(w.progress.total)c.append(node('div','meta',`視聴 ${w.progress.watched}/${w.progress.total} (${w.progress.percent}%)`));const f=node('div','card-foot');f.append(node('span','',w.yearOrPeriod||'年不明'));f.append(node('span',w.availableVideoCount?'available':'',w.availableVideoCount?`${w.availableVideoCount}/${w.videoCount} 利用可`:`${w.videoCount}動画`));c.append(f);c.onclick=()=>location.hash=`#/work/${w.id}`;return c}async function loadWorks(reset=false){if(state.loading)return;state.loading=true;if(reset){state.offset=0;works.replaceChildren()}const p=new URLSearchParams({limit:PAGE,offset:state.offset,sort:state.sort});if(state.q)p.set('q',state.q);if(state.category)p.set('category',state.category);try{const d=await api('/api/works?'+p);state.total=d.total;for(const w of d.items)works.append(card(w));state.offset+=d.items.length;loadWrap.hidden=state.offset>=state.total}finally{state.loading=false}}async function showWork(id){$('continueSection').hidden=true;$('nextSection').hidden=true;$('catalog').hidden=true;$('detail').hidden=false;const w=await api(`/api/works/${id}`),r=document.createDocumentFragment(),h=node('div','hero'),line=node('div','hero-line'),title=node('div');title.append(node('div','badge',w.category),node('h2','',w.title),node('div','meta',`視聴 ${w.progress.watched}/${w.progress.total}`));line.append(title);const a=node('div','hero-actions'),fav=node('button','action'+(w.favorite?' on':''),w.favorite?'★ お気に入り':'☆ お気に入り');fav.onclick=async()=>{w.favorite=!w.favorite;await api(`/api/me/works/${w.id}/favorite`,jo('PUT',{favorite:w.favorite}));fav.textContent=w.favorite?'★ お気に入り':'☆ お気に入り';fav.classList.toggle('on',w.favorite)};a.append(fav);line.append(a);h.append(line);r.append(h);if(w.groups.length){const g=node('div','groups');w.groups.forEach((x,i)=>{const b=node('button','group'+(i===0?' active':''),`${x.name} (${x.watchedCount}/${x.videoCount})`);b.onclick=()=>{document.querySelectorAll('.group').forEach(q=>q.classList.toggle('active',q===b));loadEpisodes(w.id,x.id)};g.append(b)});r.append(g);const ep=node('div','episodes');ep.id='episodes';r.append(ep);const vd=node('div');vd.id='videoDetail';r.append(vd)}else r.append(node('div','empty','この作品には登録済み動画がありません。'));$('workDetail').replaceChildren(r);if(w.groups.length)loadEpisodes(w.id,w.groups[0].id)}function es(v){if(v.state.watched)return'✓ 視聴済み';if(v.state.positionMs>0)return`▶ ${ft(v.state.positionMs)}`;return'○ 未視聴'}async function loadEpisodes(w,g){const e=$('episodes'),d=await api(`/api/works/${w}/videos?groupId=${g}`);e.replaceChildren();for(const v of d.items){const r=node('div','episode');r.append(node('div','ep-no',v.episodeOrType||v.contentType),node('div','',v.episodeTitle||'タイトル未設定'),node('div','episode-state'+(v.state.watched?' watched':''),(v.state.favorite?'★ · ':'')+es(v)));r.onclick=()=>showVideo(v.id);e.append(r)}}async function showVideo(id){const b=$('videoDetail'),v=await api(`/api/videos/${id}`),d=node('div','video-detail');d.append(node('h3','',`${v.episodeOrType||''} ${v.episodeTitle||''}`.trim()||v.work.title));const acts=node('div','video-actions'),fav=node('button','action'+(v.state.favorite?' on':''),v.state.favorite?'★ 動画お気に入り':'☆ 動画お気に入り'),wat=node('button','action'+(v.state.watched?' on':''),v.state.watched?'✓ 視聴済み':'○ 未視聴');fav.onclick=async()=>{v.state.favorite=!v.state.favorite;await api(`/api/me/videos/${v.id}/favorite`,jo('PUT',{favorite:v.state.favorite}));fav.textContent=v.state.favorite?'★ 動画お気に入り':'☆ 動画お気に入り'};wat.onclick=async()=>{v.state.watched=!v.state.watched;await api(`/api/me/videos/${v.id}/watched`,jo('PUT',{watched:v.state.watched}));wat.textContent=v.state.watched?'✓ 視聴済み':'○ 未視聴';loadHome()};acts.append(fav,wat);d.append(acts);if(v.file.available){const p=document.createElement('video');p.className='player';p.controls=true;p.preload='metadata';p.playsInline=true;p.src=`/video/${v.id}`;d.append(p);let sid=null,last=0;async function start(){if(sid)return sid;const x=await api(`/api/me/videos/${v.id}/playback/start`,{method:'POST'});sid=x.playSessionId;return sid}async function progress(event,force=false){if(!sid)return;const now=Date.now();if(!force&&now-last<10000)return;last=now;const x=await api(`/api/me/videos/${v.id}/playback/progress`,jo('POST',{playSessionId:sid,positionMs:Math.round(p.currentTime*1000),durationMs:Number.isFinite(p.duration)?Math.round(p.duration*1000):null,event}));v.state={...v.state,...x.state};wat.textContent=v.state.watched?'✓ 視聴済み':'○ 未視聴'}p.addEventListener('play',start);p.addEventListener('timeupdate',()=>progress('timeupdate'));p.addEventListener('pause',()=>progress('pause',true));p.addEventListener('ended',()=>progress('ended',true).then(loadHome));if(v.state.positionMs>0&&!v.state.watched){const rb=node('button','primary resume',`▶ ${ft(v.state.positionMs)} から再開`);rb.onclick=async()=>{await start();p.currentTime=v.state.positionMs/1000;p.play()};d.append(rb)}}else d.append(node('div','notice','動画ファイルが見つかりません。'));b.replaceChildren(d)}async function openInWork(w,v){location.hash=`#/work/${w}`;await showWork(w);await showVideo(v)}function route(){const m=location.hash.match(/^#\/work\/(\d+)$/);if(m){showWork(+m[1]);return}$('detail').hidden=true;$('catalog').hidden=false;loadHome();if(!works.children.length)loadWorks(true)}let timer;$('search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.q=e.target.value.trim();loadWorks(true)},250)};$('sort').onchange=e=>{state.sort=e.target.value;loadWorks(true)};$('categories').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;state.category=b.dataset.category||'';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));loadWorks(true)};$('loadMore').onclick=()=>loadWorks(false);$('back').onclick=()=>location.hash='#/library';$('scanButton').onclick=runScan;window.onhashchange=route;(async()=>{await Promise.all([loadStats(),loadUser(),loadScan(),loadHome()]);route()})();</script></body></html>
