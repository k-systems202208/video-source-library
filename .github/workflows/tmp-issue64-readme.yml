name: Apply Issue 64 README

on:
  push:
    branches: [feature/issue-64-v092-playback-audit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-64-v092-playback-audit
      - name: Patch README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          anchor = '''### 0.9.1: 再生キャッシュ容量管理
- WindowsランチャーにPlaybackCacheの現在容量・ファイル数・20GB上限を表示
- 20GBを超えた場合は最終利用時刻が古い変換キャッシュから自動削除
- キャッシュを再利用したときは最終利用時刻を更新し、最近使った動画を優先して保持
- ライブラリ停止中に「キャッシュをすべて削除」できる
- 手動削除・自動整理とも `%LOCALAPPDATA%\\VideoLibrary\\PlaybackCache` だけを対象とし、元動画・字幕・SQLite・メタデータは変更しない

'''
          addition = anchor + '''### 0.9.2: v1.0前の実ライブラリ全件再生監査
- Windowsランチャーの「全件再生監査」で登録動画を実ファイル単位にffprobe解析
- コンテナ、映像Codec、全音声Codec・言語、日本語音声、外部字幕、埋め込み字幕を集計
- 各動画を `DIRECT` / `TRANSCODE` / `NO_ROUTE` に分類
- 欠損、ffprobe失敗、映像ストリームなし、FFmpeg不在を `NO_ROUTE` として明示
- JSON / CSVレポートを `%LOCALAPPDATA%\\VideoLibrary\\diagnostics` へ出力
- 元動画・字幕・PlaybackCache・SQLiteの利用者状態は変更しない
- v1.0受入条件は実ライブラリ4,869件で `NO_ROUTE = 0`

'''
          if s.count(anchor) != 1:
              raise SystemExit('0.9.1 anchor mismatch')
          s = s.replace(anchor, addition, 1)
          s = s.replace(
              'ffprobeはCodec・音声トラック解析に使用し、ffmpegはブラウザ非互換動画を再生用MP4へ変換します。0.9.0のWindows Installerには両方を同梱します。',
              'ffprobeはCodec・音声トラック解析に使用し、ffmpegはブラウザ非互換動画を再生用MP4へ変換します。0.9.0以降のWindows Installerには両方を同梱します。',
              1,
          )
          validation_anchor = '440作品 / 4,869動画、対応字幕1,234件（紐付1,227件・対応動画なし7件）、未対応字幕3件、SQLite整合性、MISSING / NEW_FILE / 真の未紐付字幕 / 診断エラー / ffprobeエラーをまとめて確認します。対応動画なし7件は正常系として扱います。0.7.1以降、この実機検証も起動時と同じ文字化けパス修復を先に適用します。\n'
          validation_add = validation_anchor + '\n0.9.2ではさらに、Windowsランチャーでライブラリを停止してから「全件再生監査」を実行します。全登録動画をffprobeで解析し、`DIRECT` / `TRANSCODE` / `NO_ROUTE`、音声トラック、日本語音声、外部字幕、埋め込み字幕をJSON/CSVへ記録します。v1.0受入条件は4,869件すべてが監査対象となり、`NO_ROUTE = 0` であることです。\n'
          if s.count(validation_anchor) != 1:
              raise SystemExit('validation anchor mismatch')
          s = s.replace(validation_anchor, validation_add, 1)
          docs_anchor = '- [0.8.0 外部字幕のブラウザ再生](docs/30-0.8.0-external-subtitle-playback.md)\n'
          docs_add = docs_anchor + '- [全動画形式再生CI](docs/31-playback-format-ci.md)\n- [0.9.0 互換再生とプレイヤーモーダル](docs/31-0.9.0-playback-runtime-modal.md)\n- [0.9.1 再生キャッシュ容量管理](docs/32-0.9.1-playback-cache-management.md)\n- [0.9.2 実ライブラリ全件再生監査](docs/33-0.9.2-playback-audit.md)\n'
          if s.count(docs_anchor) != 1:
              raise SystemExit('docs anchor mismatch')
          s = s.replace(docs_anchor, docs_add, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "0.9.2: READMEに全件再生監査を反映"
          git push origin HEAD:feature/issue-64-v092-playback-audit
