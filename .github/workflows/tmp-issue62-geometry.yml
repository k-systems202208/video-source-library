name: Fix Issue 62 Launcher Geometry

on:
  push:
    branches: [feature/issue-62-playback-cache-management]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-62-playback-cache-management
      - name: Restore launcher geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('windows-installer/src/launcher.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('WINDOW_GEOMETRY = "780x760"', 'WINDOW_GEOMETRY = "780x690"')
          s = s.replace('WINDOW_MINSIZE = (700, 650)', 'WINDOW_MINSIZE = (700, 590)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/launcher.py
          git commit -m "0.9.1: ランチャーサイズを既存UI仕様へ維持"
          git push origin HEAD:feature/issue-62-playback-cache-management
