name: Apply cinema library catalog v3

on:
  push:
    branches:
      - feat/cinema-library-catalog-v3-125
    paths:
      - scripts/apply-cinema-library-catalog-v3.py
      - .github/workflows/apply-cinema-library-catalog-v3-125.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinema-library-catalog-v3-125
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply catalog design patch
        shell: pwsh
        run: python scripts/apply-cinema-library-catalog-v3.py
      - name: Run targeted regression tests
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_cinema_library_catalog_v3_v110
          tests.test_cinema_library_detail_v2_v110
          tests.test_cinema_library_base_design_v110
          tests.test_poster_ui_polish_v110
          tests.test_credits_people_ui_v110
          tests.test_phase2
          tests.test_phase4
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          Remove-Item scripts/apply-cinema-library-catalog-v3.py
          Remove-Item .github/workflows/apply-cinema-library-catalog-v3-125.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.1.0: シネマ蔵書館のトップと作品目録を仕上げる (#125)"
          git push origin HEAD:feat/cinema-library-catalog-v3-125
