name: Issue 55 launcher patch

on:
  push:
    branches: [feature/issue-55-video-remote-8443]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-55-video-remote-8443
      - name: Patch launcher
        shell: python
        run: |
          from pathlib import Path

          path = Path('windows-installer/src/launcher.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one launcher match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '        self.remote = tk.StringVar(value="状態を確認しています…")\n        self.scan_status = tk.StringVar(value="起動スキャン待機中")\n',
              '        self.remote = tk.StringVar(value="状態を確認しています…")\n        self.remote_url = ""\n        self.scan_status = tk.StringVar(value="起動スキャン待機中")\n',
          )

          replace_once(
              '        self.remote_disable_button = ttk.Button(remote_buttons, text="外部接続を停止", command=self.disable_remote)\n        self.remote_disable_button.pack(side="left", padx=8)\n        ttk.Button(remote_buttons, text="Tailscale再確認", command=self.refresh_remote).pack(side="right")\n',
              '        self.remote_disable_button = ttk.Button(remote_buttons, text="外部接続を停止", command=self.disable_remote)\n        self.remote_disable_button.pack(side="left", padx=8)\n        self.remote_open_button = ttk.Button(remote_buttons, text="外部URLを開く", command=self.open_remote, state="disabled")\n        self.remote_open_button.pack(side="left")\n        ttk.Button(remote_buttons, text="Tailscale再確認", command=self.refresh_remote).pack(side="right")\n',
          )

          if '    def open_remote(self) -> None:\n' not in text:
              start = text.find('    def refresh_remote(self) -> None:\n')
              end = text.find('    def enable_remote(self) -> None:\n', start)
              if start < 0 or end < 0:
                  raise SystemExit('refresh_remote/enable_remote boundary not found')
              block = (
                  '    def refresh_remote(self) -> None:\n'
                  '        status = get_remote_status()\n'
                  '        self.remote_url = status.serve_url if status.serve_active else ""\n'
                  '        self.remote_open_button.configure(state="normal" if self.remote_url else "disabled")\n'
                  '        if not status.installed:\n'
                  '            self.remote.set("Tailscale未インストール")\n'
                  '        elif not status.logged_in:\n'
                  '            self.remote.set("未ログイン")\n'
                  '        elif status.serve_active:\n'
                  '            self.remote.set(f"動画版の外部接続は有効です： {status.serve_url}")\n'
                  '        else:\n'
                  '            self.remote.set("Tailscaleログイン済み / 動画版の外部接続は停止中")\n'
                  '\n'
                  '    def open_remote(self) -> None:\n'
                  '        if not self.remote_url:\n'
                  '            self.refresh_remote()\n'
                  '        if not self.remote_url:\n'
                  '            messagebox.showinfo(APP_NAME, "動画版の外部接続を先に有効化してください。")\n'
                  '            return\n'
                  '        try:\n'
                  '            webbrowser.open(self.remote_url)\n'
                  '        except Exception as exc:\n'
                  '            messagebox.showerror(APP_NAME, f"外部URLを開けませんでした。\\n{exc}")\n'
                  '\n'
              )
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding='utf-8')
      - name: Patch README
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one README match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '### 0.7.2〜0.7.8: 字幕照合・診断完成と再生互換性改善',
              '### 0.7.2〜0.7.9: 字幕照合・診断完成と再生・外部接続互換性改善',
          )
          replace_once(
              '- 0.7.8: MKV/WebMの複数音声で日本語が存在する場合、元ファイルを変更せず配信時に日本語を優先\n',
              '- 0.7.8: MKV/WebMの複数音声で日本語が存在する場合、元ファイルを変更せず配信時に日本語を優先\n'
              '- 0.7.9: 動画版Tailscale ServeをHTTPS 8443へ分離し、Windowsランチャーに外部URLを開くボタンを追加\n',
          )
          replace_once(
              'Tailscale Serveが付与する本人情報を `user_identities` へ紐付けます。利用者ごとのお気に入り・視聴位置・履歴は混ざりません。\n\n外部公開はTailscale Serveのみを前提とします。ルーターのポート開放、DMZ、Tailscale Funnelは使用しません。\n',
              'Tailscale Serveが付与する本人情報を `user_identities` へ紐付けます。利用者ごとのお気に入り・視聴位置・履歴は混ざりません。\n\n'
              '同一PCの音楽版と競合しないよう、動画版はHTTPS 8443を使用します。動画版の外部URLは `https://<PC名>.<tailnet>.ts.net:8443/` です。Windowsランチャーの「外部URLを開く」から既定ブラウザで開けます。\n\n'
              '外部公開はTailscale Serveのみを前提とします。ルーターのポート開放、DMZ、Tailscale Funnelは使用しません。\n',
          )
          replace_once(
              '- [0.7.8 MKV複数音声の日本語優先再生](docs/28-0.7.8-japanese-audio-default.md)\n',
              '- [0.7.8 MKV複数音声の日本語優先再生](docs/28-0.7.8-japanese-audio-default.md)\n'
              '- [0.7.9 動画版Tailscale外部URLの分離](docs/29-0.7.9-video-remote-url.md)\n',
          )
          path.write_text(text, encoding='utf-8')
      - name: Verify launcher syntax and UI markers
        shell: bash
        run: |
          python -m py_compile windows-installer/src/launcher.py
          grep -F 'text="外部URLを開く"' windows-installer/src/launcher.py
          grep -F 'def open_remote(self)' windows-installer/src/launcher.py
          grep -F '0.7.9: 動画版Tailscale ServeをHTTPS 8443へ分離' README.md
      - name: Commit patches
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/launcher.py README.md
          git commit -m "Issue #55: ランチャーとREADMEを0.7.9へ同期"
          git push
