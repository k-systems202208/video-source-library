name: Apply cinema library design
on:
  push:
    branches:
      - feat/cinema-library-base-design
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply design patch
        run: python .github/scripts/apply_cinema_library_design_118.py
      - name: Run targeted tests
        run: python -m unittest tests.test_cinema_library_design_v110 tests.test_poster_ui_polish_v110 tests.test_credits_people_ui_v110
      - name: Commit product changes and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cinema-library-design-118.yml .github/scripts/apply_cinema_library_design_118.py
          git add windows-installer/src/video-library.html windows-installer/src/manifest.webmanifest windows-installer/src/launcher.py tests/test_cinema_library_design_v110.py docs/54-1.1.0-cinema-library-base-design.md
          git commit -m "1.1.0: シネマ蔵書館ベースデザインを導入 (#118)"
          git push