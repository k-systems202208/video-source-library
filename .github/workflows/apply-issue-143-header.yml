name: Apply issue 143 header migration

on:
  push:
    branches:
      - fix/sekimachi-kita-cinema-header-143

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply migration
        run: python scripts/apply_issue_143_header.py
      - name: Run targeted regression tests
        run: |
          python -m unittest tests.test_image_responsive_cinema_ui_v110
          python -m unittest tests.test_tmdb_multi_image_repair_v110
      - name: Remove one-shot migration helpers
        run: |
          rm scripts/apply_issue_143_header.py
          rm .github/workflows/apply-issue-143-header.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: center 関町北映画館 header across breakpoints (#143)"
          git push origin HEAD:fix/sekimachi-kita-cinema-header-143
