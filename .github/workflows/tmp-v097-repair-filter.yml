name: tmp-v097-repair-filter

on:
  push:
    branches:
      - fix/issue-75-v097-repair-candidates
    paths:
      - .github/workflows/tmp-v097-repair-filter.yml
      - scripts/tmp_patch_v097.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-75-v097-repair-candidates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply 0.9.7 patch
        run: python scripts/tmp_patch_v097.py
      - name: Compile and focused tests
        run: |
          python -m py_compile windows-installer/src/playback_audit.py
          python -m unittest tests.test_playback_audit_v097 tests.test_release_consistency
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/38-0.9.7-repair-candidate-filtering.md tests/test_playback_audit_v097.py tests/test_release_consistency.py windows-installer/src/playback_audit.py windows-installer/src/app_version.py windows-installer/installer/VideoLibrary.iss
          git diff --cached --quiet || git commit -m "0.9.7: 別エピソードを修復候補から除外"
          git push origin HEAD:fix/issue-75-v097-repair-candidates
