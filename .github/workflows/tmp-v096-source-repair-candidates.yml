name: tmp-v096-source-repair-candidates

on:
  push:
    branches:
      - feature/issue-72-source-repair-candidates
    paths:
      - .github/workflows/tmp-v096-source-repair-candidates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-72-source-repair-candidates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply 0.9.6 patch
        run: python scripts/tmp_patch_v096.py
      - name: Compile and focused tests
        run: |
          python -m compileall windows-installer/src tests
          python -m unittest tests.test_playback_audit_v096 tests.test_playback_audit_launcher_v096 tests.test_release_consistency
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs tests windows-installer
          git commit -m "0.9.6: 元データ異常の修復候補探索を追加"
          git push origin HEAD:feature/issue-72-source-repair-candidates
