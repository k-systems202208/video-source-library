name: Apply cinema library detail v2

on:
  push:
    branches:
      - feat/cinema-library-detail-v2-123
    paths:
      - scripts/apply-cinema-library-detail-v2.py
      - .github/workflows/apply-cinema-library-detail-v2-123.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinema-library-detail-v2-123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply detail design patch
        run: python scripts/apply-cinema-library-detail-v2.py
      - name: Run targeted regression tests
        run: >-
          python -m unittest -v
          tests.test_cinema_library_detail_v2_v110
          tests.test_cinema_library_base_design_v110
          tests.test_poster_ui_polish_v110
          tests.test_credits_people_ui_v110
          tests.test_phase2
          tests.test_phase4
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-cinema-library-detail-v2.py
          git rm .github/workflows/apply-cinema-library-detail-v2-123.yml
          git add windows-installer/src/video-library.html tests/test_cinema_library_detail_v2_v110.py docs/55-1.1.0-cinema-library-detail-v2.md
          git commit -m "1.1.0: シネマ蔵書館の詳細画面をモックアップ寄りに仕上げる (#123)"
          git push origin HEAD:feat/cinema-library-detail-v2-123
