name: tmp-issue78-patch

on:
  push:
    branches:
      - feature/issue-78-tmdb-match-images

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-78-tmdb-match-images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply TMDb matching and image UI changes
        run: python scripts/tmp_issue78_patch.py
      - name: Compile
        run: python -m compileall windows-installer/src tests
      - name: Run focused tests
        shell: pwsh
        run: |
          python -m unittest tests.test_tmdb_matching_images_v110 tests.test_tmdb_foundation_v110 tests.test_phase2 tests.test_phase5 tests.test_release_consistency -v
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md windows-installer/src/library_service.py windows-installer/src/server.py windows-installer/src/launcher.py windows-installer/src/video-library.html windows-installer/src/service-worker.js
          git commit -m "feat: TMDb作品照合とポスター表示を追加"
          git push origin HEAD:feature/issue-78-tmdb-match-images
