name: Apply Issue 59 Follow-up

on:
  push:
    branches: [feature/issue-59-playback-runtime]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-59-playback-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply follow-up patch
        run: python scripts/fix_issue59_followup.py
      - name: Commit non-workflow changes
        run: |
          rm -f scripts/fix_issue59_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/tmp-issue59-followup.yml
          git commit -m "0.9.0: モーダル表示と日本語音声CIを仕上げ"
          git push origin HEAD:feature/issue-59-playback-runtime
