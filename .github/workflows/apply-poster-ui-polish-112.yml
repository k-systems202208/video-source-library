name: Apply poster UI polish

on:
  push:
    branches:
      - fix/poster-ui-polish-112
    paths:
      - scripts/apply-poster-ui-polish-112.py
      - .github/workflows/apply-poster-ui-polish-112.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/poster-ui-polish-112
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply-poster-ui-polish-112.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.1.0: TMDbポスター表示を仕上げる (#112)"
          git push origin HEAD:fix/poster-ui-polish-112
