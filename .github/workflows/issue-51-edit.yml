name: Issue 51 final patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feature/issue-51-v077-consistency-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-51-v077-consistency-cleanup
          fetch-depth: 0
      - name: Apply remaining version patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'target not found: {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'windows-installer/src/launcher.py',
              'from app_config import load_config, save_config\n',
              'from app_config import load_config, save_config\nfrom app_version import APP_VERSION\n',
          )
          replace_once(
              'windows-installer/src/launcher.py',
              'APP_NAME = "自宅動画ライブラリ"\nAPP_VERSION = "0.7.6"\n',
              'APP_NAME = "自宅動画ライブラリ"\n',
          )
          replace_once(
              'windows-installer/src/server.py',
              'from app_config import configured_video_root, default_config_path\n',
              'from app_config import configured_video_root, default_config_path\nfrom app_version import APP_VERSION\n',
          )
          replace_once(
              'windows-installer/src/server.py',
              'APP_NAME = "VideoLibrary"\nAPI_VERSION = 1\nAPP_VERSION = "0.7.2"\n',
              'APP_NAME = "VideoLibrary"\nAPI_VERSION = 1\n',
          )
          PY
          rm .github/workflows/issue-51-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue #51: Pythonバージョン定義を共通化"
          git push origin HEAD:feature/issue-51-v077-consistency-cleanup
