name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content '.\windows-installer\src\app_version.py' -Raw
          if ($text -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw 'APP_VERSION could not be read'
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Check existing release
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            "should_release=false" >> $env:GITHUB_OUTPUT
            Write-Host "$tag already exists. Nothing to release."
          } else {
            "should_release=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag is not published yet."
          }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.release_check.outputs.should_release == 'true'
        with:
          python-version: '3.13'

      - name: Stage FFmpeg and ffprobe for installer
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ChocolateyInstall\lib\ffmpeg")) {
            choco install ffmpeg --yes --no-progress
          }
          $ffmpegRoot = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem $ffmpegRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem $ffmpegRoot -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw 'real FFmpeg binaries were not found'
          }
          $target = '.\windows-installer\tools'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $target 'ffmpeg.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $target 'ffprobe.exe') -Force

      - name: Ensure Inno Setup 6
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build Windows installer
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: .\windows-installer\build\build.ps1

      - name: Verify and package release assets
        if: steps.release_check.outputs.should_release == 'true'
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          if (-not (Test-Path '.\windows-installer\dist\VideoLibrary\VideoLibrary.exe')) {
            throw 'VideoLibrary.exe not found'
          }
          if (-not (Test-Path '.\windows-installer\dist\VideoLibrary\_internal\tools\ffmpeg.exe') -and
              -not (Test-Path '.\windows-installer\dist\VideoLibrary\tools\ffmpeg.exe')) {
            throw 'bundled ffmpeg.exe not found'
          }
          if (-not (Test-Path '.\windows-installer\dist\VideoLibrary\_internal\tools\ffprobe.exe') -and
              -not (Test-Path '.\windows-installer\dist\VideoLibrary\tools\ffprobe.exe')) {
            throw 'bundled ffprobe.exe not found'
          }

          $setup = Get-ChildItem ".\windows-installer\output\VideoLibrary-$version-setup.exe" | Select-Object -First 1
          if (-not $setup) {
            throw 'setup.exe not found'
          }

          $zip = Join-Path $PWD "VideoLibrary-Windows-Installer-$version.zip"
          Compress-Archive -Path $setup.FullName -DestinationPath $zip -Force

          "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($setup.FullName)"
          Write-Host "ZIP: $zip"

      - name: Create GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $setup = '${{ steps.assets.outputs.setup }}'
          $zip = '${{ steps.assets.outputs.zip }}'
          $notes = Get-ChildItem '.\docs' -Filter "*-$version-release.md" | Select-Object -First 1

          $args = @(
            'release', 'create', $tag,
            $setup, $zip,
            '--repo', '${{ github.repository }}',
            '--title', "自宅動画ライブラリ $version",
            '--target', $env:GITHUB_SHA
          )

          if ($notes) {
            $args += @('--notes-file', $notes.FullName)
          } else {
            $args += '--generate-notes'
          }

          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }

      - name: Upload release build artifact
        if: steps.release_check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VideoLibrary-Windows-Installer-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.assets.outputs.setup }}
            ${{ steps.assets.outputs.zip }}
          if-no-files-found: error
