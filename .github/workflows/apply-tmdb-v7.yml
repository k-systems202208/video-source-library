name: Apply TMDb matcher v7 patch

on:
  push:
    branches:
      - fix/tmdb-matcher-v7-audit-110
    paths:
      - scripts/apply-tmdb-v7.py
      - .github/workflows/apply-tmdb-v7.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tmdb-matcher-v7-audit-110
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply-tmdb-v7.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.1.0: v6実機監査の承認済み候補を確定 (#110)"
          git push origin HEAD:fix/tmdb-matcher-v7-audit-110
