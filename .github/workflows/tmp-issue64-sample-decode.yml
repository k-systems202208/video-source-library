name: Apply Issue 64 Sample Decode Audit

on:
  push:
    branches: [feature/issue-64-v092-playback-audit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-64-v092-playback-audit
      - name: Patch audit and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('windows-installer/src/playback_audit.py')
          s = p.read_text(encoding='utf-8')
          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'audit anchor mismatch {s.count(old)}: {old[:80]!r}')
              s = s.replace(old, new, 1)
          once('from dataclasses import dataclass\n', 'from dataclasses import dataclass, replace\n')
          once('    video_codec: str = ""\n    audio_codecs: tuple[str, ...] = ()\n', '    video_codec: str = ""\n    video_profile: str = ""\n    pixel_format: str = ""\n    audio_codecs: tuple[str, ...] = ()\n')
          once('    embedded_subtitle_count: int = 0\n    route: str = "NO_ROUTE"\n', '    embedded_subtitle_count: int = 0\n    sample_decode: str = "NOT_RUN"\n    route: str = "NO_ROUTE"\n')
          once('    video_codec = str(videos[0].get("codec_name") or "").strip().casefold()\n', '    video_codec = str(videos[0].get("codec_name") or "").strip().casefold()\n    video_profile = str(videos[0].get("profile") or "").strip()\n    pixel_format = str(videos[0].get("pix_fmt") or "").strip()\n')
          once('        video_codec=video_codec,\n        audio_codecs=tuple(str(item["codec"]) for item in parsed_audio),\n', '        video_codec=video_codec,\n        video_profile=video_profile,\n        pixel_format=pixel_format,\n        audio_codecs=tuple(str(item["codec"]) for item in parsed_audio),\n')
          marker = '\n\ndef _safe_source(video_root: Path, relative_path: str) -> Path | None:\n'
          verifier = (
              '\n\ndef verify_playback_sample(\n'
              '    source: Path,\n'
              '    *,\n'
              '    preferred_audio_index: int | None,\n'
              '    ffmpeg_path: Path,\n'
              '    timeout_seconds: float = 60.0,\n'
              ') -> tuple[bool, str]:\n'
              '    command = [str(ffmpeg_path), "-nostdin", "-v", "error", "-t", "0.5", "-i", str(source), "-map", "0:v:0"]\n'
              '    command.extend(["-map", f"0:{preferred_audio_index}"] if preferred_audio_index is not None else ["-map", "0:a:0?"])\n'
              '    command.extend(["-c:v", "libx264", "-preset", "ultrafast", "-crf", "30", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "96k", "-f", "null", "-"])\n'
              '    try:\n'
              '        completed = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False, timeout=timeout_seconds, creationflags=int(getattr(subprocess, "CREATE_NO_WINDOW", 0)) if os.name == "nt" else 0)\n'
              '    except (OSError, subprocess.TimeoutExpired) as exc:\n'
              '        return False, f"{type(exc).__name__}: {exc}"[:1000]\n'
              '    if completed.returncode != 0:\n'
              '        message = completed.stderr.decode("utf-8", errors="replace").strip()\n'
              '        return False, message[:1000] or f"ffmpeg exit code {completed.returncode}"\n'
              '    return True, ""\n'
          )
          once(marker, verifier + marker)
          probe_block = (
              '            result = probe_for_audit(\n'
              '                source,\n'
              '                extension=extension,\n'
              '                ffprobe_path=probe,\n'
              '                ffmpeg_available=ffmpeg is not None,\n'
              '            )\n\n'
          )
          probe_new = probe_block + (
              '            if result.route != "NO_ROUTE" and ffmpeg is not None:\n'
              '                decoded, decode_error = verify_playback_sample(\n'
              '                    source,\n'
              '                    preferred_audio_index=result.preferred_audio_index,\n'
              '                    ffmpeg_path=ffmpeg,\n'
              '                )\n'
              '                if decoded:\n'
              '                    result = replace(result, sample_decode="PASS")\n'
              '                else:\n'
              '                    result = replace(result, sample_decode="FAIL", route="NO_ROUTE", reason="DECODE_ERROR", error=decode_error)\n\n'
          )
          once(probe_block, probe_new)
          once('            "videoCodec": result.video_codec,\n            "audioCodecs": list(result.audio_codecs),\n', '            "videoCodec": result.video_codec,\n            "videoProfile": result.video_profile,\n            "pixelFormat": result.pixel_format,\n            "audioCodecs": list(result.audio_codecs),\n')
          once('            "embeddedSubtitleCount": result.embedded_subtitle_count,\n            "route": result.route,\n', '            "embeddedSubtitleCount": result.embedded_subtitle_count,\n            "sampleDecode": result.sample_decode,\n            "route": result.route,\n')
          once('        "probeErrors": sum(1 for item in items if item.get("reason") == "PROBE_ERROR"),\n', '        "probeErrors": sum(1 for item in items if item.get("reason") == "PROBE_ERROR"),\n        "decodeErrors": sum(1 for item in items if item.get("reason") == "DECODE_ERROR"),\n')
          once('        "containerFormat", "videoCodec", "audioCodecs", "audioLanguages", "audioTrackCount",\n', '        "containerFormat", "videoCodec", "videoProfile", "pixelFormat", "audioCodecs", "audioLanguages", "audioTrackCount",\n')
          once('        "externalSubtitleCount", "embeddedSubtitleCount", "route", "reason", "error",\n', '        "externalSubtitleCount", "embeddedSubtitleCount", "sampleDecode", "route", "reason", "error",\n')
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_playback_audit_v092.py')
          ts = t.read_text(encoding='utf-8')
          old = '            ), mock.patch("playback_audit.probe_for_audit", return_value=fake):\n                report = audit_real_library(db, root, output)\n'
          new = '            ), mock.patch("playback_audit.probe_for_audit", return_value=fake), mock.patch(\n                "playback_audit.verify_playback_sample", return_value=(True, "")\n            ):\n                report = audit_real_library(db, root, output)\n'
          if ts.count(old) != 1:
              raise SystemExit('test anchor mismatch')
          t.write_text(ts.replace(old, new, 1), encoding='utf-8')

          d = Path('docs/33-0.9.2-playback-audit.md')
          ds = d.read_text(encoding='utf-8')
          anchor = '- ffprobeによる読み取り専用解析だけを行う\n'
          replacement = '- ffprobeで全ストリームを解析し、同梱FFmpegで先頭0.5秒の映像・優先音声をH.264 + AACへサンプル変換してデコード経路も確認する\n- サンプルデコードは一時出力を作らずnull出力へ流すため、元動画・PlaybackCacheを変更しない\n'
          if ds.count(anchor) != 1:
              raise SystemExit('doc anchor mismatch')
          d.write_text(ds.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Commit sample decode audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/playback_audit.py tests/test_playback_audit_v092.py docs/33-0.9.2-playback-audit.md
          git commit -m "0.9.2: 全件監査にFFmpegサンプルデコード確認を追加"
          git push origin HEAD:feature/issue-64-v092-playback-audit
