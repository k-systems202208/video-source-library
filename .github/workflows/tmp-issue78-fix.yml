name: tmp-issue78-fix

on:
  push:
    branches:
      - feature/issue-78-tmdb-match-images

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-78-tmdb-match-images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply quote fix
        run: python scripts/tmp_issue78_fix.py
      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall windows-installer/src tests
          python -m unittest tests.test_tmdb_matching_images_v110 tests.test_tmdb_foundation_v110 tests.test_phase2 tests.test_phase5 tests.test_release_consistency -v
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/library_service.py
          git commit -m "fix: TMDb画像URLのf-string構文を修正"
          git push origin HEAD:feature/issue-78-tmdb-match-images
