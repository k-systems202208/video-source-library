name: Issue 70 apply 0.9.5

on:
  push:
    branches:
      - feature/issue-70-audit-source-errors

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-70-audit-source-errors
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/issue70_patch.py

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "0.9.5: 再生互換性と元データ異常を監査で分離"
          git push origin HEAD:feature/issue-70-audit-source-errors
