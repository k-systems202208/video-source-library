name: Issue 53 docs sync

on:
  push:
    branches: [feature/issue-53-japanese-audio-default]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-53-japanese-audio-default
      - name: Sync README with 0.7.8
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '''### 0.7.2〜0.7.7: 字幕照合・診断完成と整合性整理
          - 0.7.2: 同一作品内で一意に確定できる字幕だけを安全に自動紐付け
          - 0.7.3: WindowsランチャーUIを音楽ライブラリと同系統へ統一
          - 0.7.4: 残存字幕を安全条件の範囲で追加照合
          - 0.7.5: 対応動画が登録されていない字幕を「対応動画なし」として正常系へ分離
          - 0.7.6: 診断ヘッダーを「字幕判定」に変更し、紐付済みと対応動画なしを明示
          - 0.7.7: 実機検証、アプリバージョン、README / Phase 6文書の整合性を整理
          '''.replace('          ','')
          new = '''### 0.7.2〜0.7.8: 字幕照合・診断完成と再生互換性改善
          - 0.7.2: 同一作品内で一意に確定できる字幕だけを安全に自動紐付け
          - 0.7.3: WindowsランチャーUIを音楽ライブラリと同系統へ統一
          - 0.7.4: 残存字幕を安全条件の範囲で追加照合
          - 0.7.5: 対応動画が登録されていない字幕を「対応動画なし」として正常系へ分離
          - 0.7.6: 診断ヘッダーを「字幕判定」に変更し、紐付済みと対応動画なしを明示
          - 0.7.7: 実機検証、アプリバージョン、README / Phase 6文書の整合性を整理
          - 0.7.8: MKV/WebMの複数音声で日本語が存在する場合、元ファイルを変更せず配信時に日本語を優先
          '''.replace('          ','')
          if text.count(old) != 1:
              raise SystemExit('release history block not found exactly once')
          text = text.replace(old, new, 1)
          marker = '- [0.7.7 整合性整理](docs/27-0.7.7-consistency-cleanup.md)\n'
          addition = marker + '- [0.7.8 MKV複数音声の日本語優先再生](docs/28-0.7.8-japanese-audio-default.md)\n'
          if text.count(marker) != 1:
              raise SystemExit('0.7.7 docs marker not found exactly once')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Issue #53: READMEを0.7.8へ同期"
          git push
