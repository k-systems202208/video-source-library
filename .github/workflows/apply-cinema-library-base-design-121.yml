name: Apply cinema library base design

on:
  push:
    branches:
      - feat/cinema-library-base-design-121
    paths:
      - .github/workflows/apply-cinema-library-base-design-121.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinema-library-base-design-121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply design patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('windows-installer/src/video-library.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<meta name="theme-color" content="#171a1f">': '<meta name="theme-color" content="#120e0c">',
              '<title>自宅動画ライブラリ</title>': '<title>シネマ蔵書館</title>',
              '<div class="brand"><h1>自宅動画ライブラリ</h1><p>Video Library Catalog</p></div>': '<div class="brand"><div class="brand-kicker">PRIVATE CINEMA ARCHIVE</div><h1><span class="brand-mark" aria-hidden="true">◉</span> シネマ蔵書館</h1><p>映画で、また会える。</p></div>',
              '<section id="continueSection" class="home-strip" hidden><h2>続きから見る</h2>': '<section id="continueSection" class="home-strip" hidden><h2><span class="section-icon" aria-hidden="true">●</span> 上映中 <small>NOW SHOWING</small></h2>',
              '<section id="nextSection" class="home-strip" hidden><h2>次に見る</h2>': '<section id="nextSection" class="home-strip" hidden><h2><span class="section-icon" aria-hidden="true">◆</span> 次回上映 <small>COMING SOON</small></h2>',
              'placeholder="作品名・監督・出演者を検索"': 'placeholder="作品・俳優・監督を検索..."',
              '<button class="ghost" id="back">← 作品一覧</button>': '<button class="ghost" id="back">← 作品目録</button>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new, 1)

          marker = '/* CINEMA_LIBRARY_BASE_DESIGN_V1 */'
          if marker in text:
              raise SystemExit('design marker already exists')

          css = r'''
    /* CINEMA_LIBRARY_BASE_DESIGN_V1 */
    :root{
      --bg:#100d0b;--panel:#1b1714;--panel2:#15110f;--line:#4b3b2c;
      --text:#f3ead8;--muted:#b8aa95;--accent:#c59a4a;--accent2:#f1d99a;
      --cinema-red:#6f171b;--cinema-red2:#932a29;--brass:#b88b3e;--cream:#efe2c7;
    }
    html,body{background:
      radial-gradient(circle at 50% -20%,rgba(111,23,27,.18),transparent 36rem),
      linear-gradient(180deg,#120f0d 0%,#0d0b0a 100%);color:var(--text)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;z-index:-1;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 5px)}
    .app{max-width:1320px;padding-top:14px}
    header{position:relative;align-items:center;margin-bottom:24px;padding:14px 18px 16px;border:1px solid #58432e;border-radius:6px;background:linear-gradient(180deg,#251b16,#17120f);box-shadow:inset 0 1px rgba(255,255,255,.05),0 12px 30px rgba(0,0,0,.28)}
    header::before,header::after{content:"";position:absolute;left:12px;right:12px;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
    header::before{top:5px}header::after{bottom:5px}
    .brand-kicker{font:600 10px/1.3 Georgia,"Times New Roman",serif;letter-spacing:.24em;color:var(--accent);margin-bottom:4px}
    .brand h1{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;font-size:30px;letter-spacing:.06em;color:var(--cream);text-shadow:0 1px #000}
    .brand-mark{display:inline-grid;place-items:center;color:var(--accent);font-size:.8em;transform:translateY(-1px)}
    .brand p{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:#cab999;letter-spacing:.12em;font-size:12px}
    .search,.sort{background:#14110f;border-color:#59442f;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
    .search:focus,.sort:focus{outline:1px solid var(--accent);border-color:var(--accent)}
    .chip,.ghost,.group,.action,.tag{border-color:#57442f;background:linear-gradient(180deg,#211a15,#17120f);border-radius:5px}
    .chip.active,.primary{background:linear-gradient(180deg,var(--cinema-red2),var(--cinema-red));color:#fff3df;border:1px solid #c99c4e;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,225,164,.12);font-weight:700}
    .ghost:hover,.group:hover,.action:hover,.chip:hover{border-color:var(--accent);color:var(--accent2)}
    .home-strip{margin-bottom:25px;padding-top:3px}
    .home-strip h2{display:flex;align-items:baseline;gap:8px;font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;font-size:19px;letter-spacing:.06em;color:var(--cream);padding-bottom:8px;border-bottom:1px solid #59432e}
    .home-strip h2::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#6f5636,transparent)}
    .home-strip h2 small{font:600 9px/1.2 Georgia,serif;letter-spacing:.18em;color:var(--accent)}
    .section-icon{font-size:9px;color:var(--accent)}
    .mini{background:linear-gradient(145deg,#201914,#15110f);border-color:#4e3d2d;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(196,151,72,.04)}
    .mini:hover,.mini:focus-within{border-color:var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.38),inset 0 0 0 1px rgba(197,154,74,.12)}
    .mini-poster,.mini-poster-fallback{border-right:1px solid #5b442d}
    .grid{gap:17px}
    .card{background:linear-gradient(155deg,#211a15 0%,#171310 72%);border:1px solid #55412e;border-radius:6px;box-shadow:0 7px 20px rgba(0,0,0,.22),inset 0 0 0 1px rgba(218,174,91,.035)}
    .card:hover,.card:focus-within{transform:translateY(-4px);border-color:#ae8240;box-shadow:0 15px 36px rgba(0,0,0,.4),0 0 0 1px rgba(197,154,74,.12)}
    .poster{background:#0c0a09;border-bottom-color:#674c30;padding:7px}
    .poster img,.poster-fallback{border:1px solid #76562f;box-shadow:0 5px 16px rgba(0,0,0,.45)}
    .card-body{padding:13px 15px 16px}
    .card h2{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;color:var(--cream);letter-spacing:.025em}
    .badge,.ep-no{color:#d5a854;letter-spacing:.04em}
    .progress{background:#33291f;border-radius:0}.progress>span{background:linear-gradient(90deg,#7b1c1f,#c29445)}
    .hero{border:1px solid #644a30;border-radius:7px;background:#18130f;box-shadow:0 16px 45px rgba(0,0,0,.32)}
    .hero.has-backdrop::before{background:linear-gradient(90deg,rgba(15,12,10,.97) 0%,rgba(15,12,10,.88) 38%,rgba(15,12,10,.67) 72%,rgba(15,12,10,.82) 100%)}
    .hero-poster,.hero-poster-fallback{border-radius:3px;border:1px solid #b18646;box-shadow:0 12px 30px rgba(0,0,0,.58),0 0 0 5px rgba(30,23,17,.86)}
    .hero-body h1,.hero-body h2{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;letter-spacing:.045em;color:#f5e8ce}
    .overview{color:#ded3c1;text-shadow:0 1px 2px #000}
    .credits{border-top-color:#674c30}
    .credit-label{color:#c6b294;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
    .person-link{background:rgba(25,19,15,.84);border-color:#655039;color:#f0d797;border-radius:999px}
    .person-link:hover,.person-link:focus-visible{background:#291d15;border-color:#c59a4a}
    .group.active,.action.on{border-color:#b88b3e;color:#efd898;background:#261d16}
    .episode,.video-detail,.tech-item{border-color:#4e3d2d;border-radius:5px;background:linear-gradient(180deg,#1d1713,#15110f)}
    .player-dialog,.scan-dialog{border-color:#604a33;background:#18130f;border-radius:7px}
    .tmdb-credit{border-top-color:#493829;color:#857967;font-family:Georgia,"Times New Roman",serif;letter-spacing:.04em}
    .available,.scan-status.ok,.watched{color:#91c493}
    @media(max-width:700px){
      header{padding:13px 14px}.brand h1{font-size:25px}.brand-kicker{font-size:8px}
      .home-strip h2 small{display:none}.poster{padding:5px}.card-body{padding:11px 12px 14px}
    }
          '''
          if '</style>' not in text:
              raise SystemExit('style closing tag not found')
          text = text.replace('  </style>', css + '\n  </style>', 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_cinema_library_base_design_v110.py')
          test.write_text(r'''from pathlib import Path
import unittest

ROOT = Path(__file__).resolve().parents[1]
HTML = ROOT / "windows-installer" / "src" / "video-library.html"


class CinemaLibraryBaseDesignV110Tests(unittest.TestCase):
    @classmethod
    def setUpClass(cls):
        cls.html = HTML.read_text(encoding="utf-8")

    def test_brand_is_cinema_library(self):
        self.assertIn("<title>シネマ蔵書館</title>", self.html)
        self.assertIn("シネマ蔵書館", self.html)
        self.assertIn("映画で、また会える。", self.html)
        self.assertIn("PRIVATE CINEMA ARCHIVE", self.html)

    def test_theater_language_is_used(self):
        self.assertIn("上映中", self.html)
        self.assertIn("NOW SHOWING", self.html)
        self.assertIn("次回上映", self.html)
        self.assertIn("COMING SOON", self.html)
        self.assertIn("← 作品目録", self.html)

    def test_classic_design_marker_and_palette_exist(self):
        self.assertIn("CINEMA_LIBRARY_BASE_DESIGN_V1", self.html)
        self.assertIn("--cinema-red:#6f171b", self.html)
        self.assertIn("--brass:#b88b3e", self.html)
        self.assertIn("Yu Mincho", self.html)

    def test_existing_functional_ids_are_preserved(self):
        for value in ("scanButton", "continueSection", "nextSection", "search", "sort", "works", "workDetail", "playerModal"):
            self.assertIn(f'id="{value}"', self.html)

    def test_display_version_is_not_changed_by_design(self):
        app_version = (ROOT / "windows-installer" / "src" / "app_version.py").read_text(encoding="utf-8")
        self.assertIn('APP_VERSION = "1.1.0"', app_version)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          doc = Path('docs/54-1.1.0-cinema-library-base-design.md')
          doc.write_text('''# 1.1.0 シネマ蔵書館 ベースデザイン\n\n## 目的\nA案のクラシックな映画館テイストを、現行UI構造と機能を維持したまま適用する。名称は「シネマ蔵書館」とする。\n\n## 第1段階の変更\n- アプリ名を「シネマ蔵書館」へ変更\n- キャッチコピーを「映画で、また会える。」へ変更\n- 黒／焦げ茶を基調に、えんじ・真鍮・アイボリーをアクセントとして採用\n- 「続きから見る」を「上映中」、「次に見る」を「次回上映」へ変更\n- 作品カードを額縁風のポスター主体デザインへ変更\n- 詳細画面、ボタン、人物リンク、エピソード枠を同じクラシックシネマ調へ統一\n- モバイル表示を維持\n\n## 今回変更しないもの\n- 再生ロジック\n- TMDb照合・画像取得\n- 人物リンク\n- お気に入り等の機能ロジック\n- DBスキーマ\n- 表示バージョン `1.1.0`\n\n## 次段階候補\n実機確認後、サイドナビゲーション、劇場看板風ロゴの強化、カテゴリの映画館語彙化、詳細画面の情報配置を検討する。\n''', encoding='utf-8')
          PY
      - name: Run targeted tests
        run: python -m unittest tests.test_cinema_library_base_design_v110 tests.test_poster_ui_polish_v110 tests.test_credits_people_ui_v110
      - name: Commit product changes and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-cinema-library-base-design-121.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/video-library.html tests/test_cinema_library_base_design_v110.py docs/54-1.1.0-cinema-library-base-design.md .github/workflows/apply-cinema-library-base-design-121.yml
          git commit -m "1.1.0: シネマ蔵書館ベースデザインを適用 (#121)"
          git push origin HEAD:feat/cinema-library-base-design-121
