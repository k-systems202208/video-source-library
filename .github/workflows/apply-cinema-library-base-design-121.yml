name: Apply cinema library base design

on:
  push:
    branches:
      - feat/cinema-library-base-design-121
    paths:
      - scripts/apply-cinema-library-base-design-121.py
      - .github/workflows/apply-cinema-library-base-design-121.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinema-library-base-design-121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/apply-cinema-library-base-design-121.py
      - name: Run targeted tests
        run: python -m unittest tests.test_cinema_library_base_design_v110 tests.test_poster_ui_polish_v110 tests.test_credits_people_ui_v110
      - name: Commit product changes and remove helpers
        shell: bash
        run: |
          rm scripts/apply-cinema-library-base-design-121.py
          rm .github/workflows/apply-cinema-library-base-design-121.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.1.0: シネマ蔵書館ベースデザインを適用 (#121)"
          git push origin HEAD:feat/cinema-library-base-design-121
