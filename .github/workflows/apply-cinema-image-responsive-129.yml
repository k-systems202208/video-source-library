name: Apply cinema image responsive

on:
  push:
    branches:
      - feat/cinema-library-image-responsive-129
    paths:
      - scripts/apply-cinema-image-responsive.py
      - .github/workflows/apply-cinema-image-responsive-129.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinema-library-image-responsive-129
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply image responsive patch
        shell: pwsh
        run: python scripts/apply-cinema-image-responsive.py
      - name: Run targeted regression tests
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_cinema_image_responsive_v110
          tests.test_cinema_library_final_polish_v110
          tests.test_cinema_library_catalog_v3_v110
          tests.test_cinema_library_detail_v2_v110
          tests.test_cinema_library_base_design_v110
          tests.test_poster_ui_polish_v110
          tests.test_credits_people_ui_v110
          tests.test_phase2
          tests.test_phase4
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          Remove-Item scripts/apply-cinema-image-responsive.py
          Remove-Item .github/workflows/apply-cinema-image-responsive-129.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.1.0: シネマ蔵書館を画像アセット化しレスポンシブを強化 (#129)"
          git push origin HEAD:feat/cinema-library-image-responsive-129
