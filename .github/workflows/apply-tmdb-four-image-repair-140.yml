name: Apply TMDb four image repair 140

on:
  push:
    branches:
      - fix/tmdb-four-image-repair-header-140
    paths:
      - scripts/apply-tmdb-four-image-repair-140.py
      - .github/workflows/apply-tmdb-four-image-repair-140.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        shell: pwsh
        run: python scripts/apply-tmdb-four-image-repair-140.py
      - name: Targeted tests
        shell: pwsh
        run: |
          python -m unittest tests.test_tmdb_multi_image_repair_v110 tests.test_tmdb_image_cache_refresh_v110 tests.test_tmdb_detail_metadata_refresh_v110 tests.test_image_responsive_cinema_ui_v110
      - name: Commit product changes and remove temporary files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/tmdb_sync.py windows-installer/src/server.py windows-installer/src/video-library.html tests/test_tmdb_detail_metadata_refresh_v110.py tests/test_tmdb_multi_image_repair_v110.py docs/61-1.1.0-four-tmdb-image-repair-header.md
          git rm scripts/apply-tmdb-four-image-repair-140.py .github/workflows/apply-tmdb-four-image-repair-140.yml
          git commit -m "1.1.0: 4作品のTMDb画像キャッシュ修復とヘッダー左寄せ (#140)"
          git push origin HEAD:fix/tmdb-four-image-repair-header-140
