name: Apply Issue 64 Audit Error Sanitization

on:
  push:
    branches: [feature/issue-64-v092-playback-audit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-64-v092-playback-audit
      - name: Sanitize process errors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('windows-installer/src/playback_audit.py')
          s = p.read_text(encoding='utf-8')
          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'anchor mismatch {s.count(old)}: {old[:100]!r}')
              s = s.replace(old, new, 1)
          marker = '\n\ndef probe_for_audit(\n'
          helper = (
              '\n\ndef _sanitize_process_error(text: str, source: Path) -> str:\n'
              '    sanitized = str(text or "")\n'
              '    candidates = {str(source), source.as_posix()}\n'
              '    try:\n'
              '        candidates.add(str(source.resolve()))\n'
              '        candidates.add(source.resolve().as_posix())\n'
              '    except OSError:\n'
              '        pass\n'
              '    for candidate in sorted((value for value in candidates if value), key=len, reverse=True):\n'
              '        sanitized = sanitized.replace(candidate, "<video>")\n'
              '    return sanitized[:1000]\n'
          )
          once(marker, helper + marker)
          once('        return AuditProbe(status="ERROR", route="NO_ROUTE", reason="PROBE_ERROR", error=f"{type(exc).__name__}: {exc}"[:1000])\n', '        return AuditProbe(status="ERROR", route="NO_ROUTE", reason="PROBE_ERROR", error=_sanitize_process_error(f"{type(exc).__name__}: {exc}", source))\n')
          once('        return AuditProbe(status="ERROR", route="NO_ROUTE", reason="PROBE_ERROR", error=error[:1000] or f"ffprobe exit code {completed.returncode}")\n', '        return AuditProbe(status="ERROR", route="NO_ROUTE", reason="PROBE_ERROR", error=_sanitize_process_error(error, source) or f"ffprobe exit code {completed.returncode}")\n')
          once('        return False, f"{type(exc).__name__}: {exc}"[:1000]\n', '        return False, _sanitize_process_error(f"{type(exc).__name__}: {exc}", source)\n')
          once('        return False, message[:1000] or f"ffmpeg exit code {completed.returncode}"\n', '        return False, _sanitize_process_error(message, source) or f"ffmpeg exit code {completed.returncode}"\n')
          once('        "missing": sum(1 for item in items if item.get("reason") == "MISSING_FILE"),\n', '        "missing": sum(1 for item in items if item.get("reason") == "MISSING_FILE"),\n        "pathEscapes": sum(1 for item in items if item.get("reason") == "PATH_ESCAPE"),\n')
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_playback_audit_v092.py')
          ts = t.read_text(encoding='utf-8')
          ts = ts.replace('from playback_audit import AuditProbe, audit_real_library, parse_audit_probe_payload, summarize_audit, write_audit_reports\n', 'from playback_audit import AuditProbe, _sanitize_process_error, audit_real_library, parse_audit_probe_payload, summarize_audit, write_audit_reports\n', 1)
          insert = '''    def test_process_errors_do_not_expose_absolute_source_path(self) -> None:\n        source = Path(r"Z:\\Files\\shared\\動画\\secret.mkv")\n        message = f"{source}: Invalid data found when processing input"\n        sanitized = _sanitize_process_error(message, source)\n        self.assertNotIn(str(source), sanitized)\n        self.assertIn("<video>", sanitized)\n\n'''
          anchor = '    def test_second_japanese_audio_requires_transcode(self) -> None:\n'
          if ts.count(anchor) != 1:
              raise SystemExit('test insertion anchor mismatch')
          ts = ts.replace(anchor, insert + anchor, 1)
          t.write_text(ts, encoding='utf-8')
          PY
      - name: Commit sanitization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/playback_audit.py tests/test_playback_audit_v092.py
          git commit -m "0.9.2: 監査エラーから物理パスを除去"
          git push origin HEAD:feature/issue-64-v092-playback-audit
