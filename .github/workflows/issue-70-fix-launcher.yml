name: Issue 70 fix launcher

on:
  push:
    branches:
      - feature/issue-70-audit-source-errors

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-70-audit-source-errors
          fetch-depth: 0

      - name: Fix launcher source
        run: python scripts/issue70_fix_launcher.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "0.9.5: ランチャー監査結果メッセージを修正"
          git push origin HEAD:feature/issue-70-audit-source-errors
