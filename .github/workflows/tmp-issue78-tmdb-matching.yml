name: tmp-issue78-tmdb-matching

on:
  push:
    branches:
      - feature/issue-78-tmdb-matching

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-78-tmdb-matching
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply issue 78 launcher and docs changes
        run: python scripts/tmp_issue78_patch.py
      - name: Run focused tests
        shell: pwsh
        run: |
          python -m unittest tests.test_tmdb_matching_v110 tests.test_tmdb_foundation_v110 tests.test_release_consistency tests.test_launcher_layout_v093 -v
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md windows-installer/src/launcher.py
          git commit -m "feat: TMDb作品照合をランチャーへ追加"
          git push origin HEAD:feature/issue-78-tmdb-matching
