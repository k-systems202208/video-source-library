name: Apply responsive cinema UI

on:
  push:
    branches:
      - feat/image-based-responsive-cinema-ui-134
    paths:
      - scripts/apply-responsive-cinema-ui-134.py
      - .github/workflows/apply-responsive-cinema-ui-134.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/image-based-responsive-cinema-ui-134
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply responsive cinema UI patch
        shell: pwsh
        run: python scripts/apply-responsive-cinema-ui-134.py
      - name: Run targeted regression tests
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_image_responsive_cinema_ui_v110
          tests.test_cinema_library_final_polish_v110
          tests.test_cinema_library_catalog_v3_v110
          tests.test_cinema_library_detail_v2_v110
          tests.test_poster_ui_polish_v110
          tests.test_credits_people_ui_v110
          tests.test_phase2
          tests.test_phase4
      - name: Commit product changes and remove temporary helpers
        shell: pwsh
        run: |
          Remove-Item scripts/apply-responsive-cinema-ui-134.py
          Remove-Item .github/workflows/apply-responsive-cinema-ui-134.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1.1.0: 画像パーツ化とレスポンシブ映画館UIを実装 (#134)"
          git push origin HEAD:feat/image-based-responsive-cinema-ui-134