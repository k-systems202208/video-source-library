name: Issue 53 audio patch

on:
  push:
    branches: [feature/issue-53-japanese-audio-default]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-53-japanese-audio-default
      - name: Apply server and browser patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'windows-installer/src/server.py',
              'from local_auth import LocalOwnerAuth, cookie_value, session_cookie_header\nfrom scan_diagnostics import diagnostics_csv_bytes, diagnostics_json_bytes, scan_diagnostics\n',
              'from local_auth import LocalOwnerAuth, cookie_value, session_cookie_header\nfrom matroska_audio import apply_patch_to_chunk, preferred_japanese_audio_patch\nfrom scan_diagnostics import diagnostics_csv_bytes, diagnostics_json_bytes, scan_diagnostics\n',
          )
          replace_once(
              'windows-installer/src/server.py',
              '            path, extension = resolved\n            try:\n',
              '            path, extension = resolved\n            audio_patch = preferred_japanese_audio_patch(path) if extension.casefold().lstrip(".") in {"mkv", "webm"} else None\n            try:\n',
          )
          replace_once(
              'windows-installer/src/server.py',
              '            self.send_header("Accept-Ranges", "bytes"); self.send_header("Content-Length", str(length))\n            if status == 206:\n',
              '            self.send_header("Accept-Ranges", "bytes"); self.send_header("Content-Length", str(length))\n            if audio_patch is not None:\n                self.send_header("X-Video-Library-Audio-Preference", "ja")\n            if status == 206:\n',
          )
          replace_once(
              'windows-installer/src/server.py',
              '                    while remaining > 0:\n                        chunk = handle.read(min(CHUNK_SIZE, remaining))\n                        if not chunk:\n                            break\n                        self.wfile.write(chunk); remaining -= len(chunk)\n',
              '                    while remaining > 0:\n                        chunk_start = handle.tell()\n                        chunk = handle.read(min(CHUNK_SIZE, remaining))\n                        if not chunk:\n                            break\n                        chunk = apply_patch_to_chunk(chunk, chunk_start, audio_patch)\n                        self.wfile.write(chunk); remaining -= len(chunk)\n',
          )

          prefer_js = "function preferJapaneseAudio(p){const tracks=p.audioTracks;if(!tracks||!tracks.length)return false;let jp=-1;for(let i=0;i<tracks.length;i++){const t=tracks[i],lang=String(t.language||'').toLowerCase().replace('_','-'),label=String(t.label||'').toLowerCase();if(lang==='ja'||lang==='jpn'||lang.startsWith('ja-')||lang.startsWith('jpn-')||label.includes('japanese')||label.includes('日本語')){jp=i;break}}if(jp<0)return false;for(let i=0;i<tracks.length;i++)tracks[i].enabled=i===jp;return true}\n"
          replace_once(
              'windows-installer/src/video-library.html',
              "function techValue(v,fallback='未取得'){return v===null||v===undefined||v===''?fallback:String(v)}\n",
              "function techValue(v,fallback='未取得'){return v===null||v===undefined||v===''?fallback:String(v)}\n" + prefer_js,
          )
          replace_once(
              'windows-installer/src/video-library.html',
              "p.src=`/video/${v.id}`;d.append(p);let sid=null,last=0;",
              "p.src=`/video/${v.id}`;d.append(p);p.addEventListener('loadedmetadata',()=>preferJapaneseAudio(p));if(p.audioTracks&&p.audioTracks.addEventListener)p.audioTracks.addEventListener('addtrack',()=>preferJapaneseAudio(p));let sid=null,last=0;",
          )
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/server.py windows-installer/src/video-library.html
          git commit -m "Issue #53: ブラウザ再生で日本語音声を優先"
          git push
