name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase1:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall windows-installer/src scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic 440/4869 import
        run: python scripts/validate_ci_fixture.py
