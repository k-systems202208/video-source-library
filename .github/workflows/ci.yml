name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall windows-installer/src scripts tests
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic 440/4869 import
        run: python scripts/validate_ci_fixture.py

  playback-formats:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure FFmpeg and ffprobe
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath"
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Validate all real-library video formats
        run: python scripts/validate_playback_formats.py

  installer:
    runs-on: windows-latest
    needs: [test, playback-formats]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stage FFmpeg and ffprobe for installer
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ChocolateyInstall\lib\ffmpeg")) {
            choco install ffmpeg --yes --no-progress
          }
          $ffmpegRoot = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem $ffmpegRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem $ffmpegRoot -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'real FFmpeg binaries were not found' }
          $target = '.\windows-installer\tools'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $target 'ffmpeg.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $target 'ffprobe.exe') -Force
          Write-Host "FFmpeg staged: $($ffmpeg.FullName)"
          Write-Host "ffprobe staged: $($ffprobe.FullName)"
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
      - name: Build Windows installer
        shell: pwsh
        run: .\windows-installer\build\build.ps1
      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path '.\windows-installer\dist\VideoLibrary\VideoLibrary.exe')) { throw 'VideoLibrary.exe not found' }
          if (-not (Test-Path '.\windows-installer\dist\VideoLibrary\_internal\tools\ffmpeg.exe') -and -not (Test-Path '.\windows-installer\dist\VideoLibrary\tools\ffmpeg.exe')) { throw 'bundled ffmpeg.exe not found' }
          if (-not (Test-Path '.\windows-installer\dist\VideoLibrary\_internal\tools\ffprobe.exe') -and -not (Test-Path '.\windows-installer\dist\VideoLibrary\tools\ffprobe.exe')) { throw 'bundled ffprobe.exe not found' }
          $setup = Get-ChildItem '.\windows-installer\output\VideoLibrary-*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'setup.exe not found' }
          Write-Host "Installer: $($setup.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: VideoLibrary-Windows-Installer
          path: windows-installer/output/VideoLibrary-*-setup.exe
          if-no-files-found: error
