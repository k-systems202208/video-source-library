name: Apply TMDb runtime v4 patch

on:
  push:
    branches: [fix/tmdb-audit-runtime-version-102]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-v4-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tmdb-audit-runtime-version-102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/apply_tmdb_runtime_v4.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md windows-installer/src/tmdb_sync.py tests/test_tmdb_combined_media_v110.py tests/test_tmdb_matcher_v3_v110.py
          git diff --cached --quiet && exit 0
          git commit -m "1.1.0: TMDb監査にruntime versionを記録 [runtime-v4-applied]"
          git push origin HEAD:fix/tmdb-audit-runtime-version-102
