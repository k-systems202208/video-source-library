name: tmp-v100-release

on:
  push:
    branches:
      - release/issue-77-v100
    paths:
      - .github/workflows/tmp-v100-release.yml
      - scripts/tmp_patch_v100.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/issue-77-v100
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply 1.0.0 release patch
        run: python scripts/tmp_patch_v100.py
      - name: Compile and focused tests
        run: |
          python -m py_compile windows-installer/src/app_version.py
          python -m unittest tests.test_release_consistency tests.test_release_v100
      - name: Commit release patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/39-1.0.0-release.md tests/test_release_consistency.py tests/test_release_v100.py windows-installer/src/app_version.py windows-installer/installer/VideoLibrary.iss
          git diff --cached --quiet || git commit -m "1.0.0: 正式版の受入結果とバージョンを固定"
          git push origin HEAD:release/issue-77-v100
