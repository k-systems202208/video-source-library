name: Apply TRICK image cache fix
on:
  push:
    branches:
      - fix/trick-image-cache-114
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('windows-installer/src/tmdb_sync.py')
          text = path.read_text(encoding='utf-8')

          old = '''_MATCHER_VERSION = 7\n_MATCHER_VERSION_CACHE_KEY = "tmdb:matcher-version"\n_SEARCH_CACHE_VERSION = 3\n'''
          new = '''_MATCHER_VERSION = 7\n_MATCHER_VERSION_CACHE_KEY = "tmdb:matcher-version"\n_SEARCH_CACHE_VERSION = 3\n_IMAGE_CACHE_REPAIR_VERSION = 1\n_IMAGE_CACHE_REPAIR_KEY = "tmdb:image-cache-repair-version"\n\n# v3時代に誤MATCHEDだったTRICKは、後続matcherでtv/19616へ修正されても\n# workId.jpg が残り続けたため、既存インストールで一度だけ画像を取り直す。\n_LEGACY_STALE_IMAGE_WORKS: set[tuple[str, str]] = {\n    ("TRICK", "2000-2003"),\n}\n'''
          if old not in text:
              raise SystemExit('constants anchor not found')
          text = text.replace(old, new, 1)

          old = '''def _store_matcher_version(connection: sqlite3.Connection) -> None:\n    put_cached_json(\n        connection,\n        _MATCHER_VERSION_CACHE_KEY,\n        {"version": _MATCHER_VERSION},\n        fetched_at=now_iso(),\n        expires_at=None,\n    )\n\n\ndef _year_similarity'''
          new = '''def _store_matcher_version(connection: sqlite3.Connection) -> None:\n    put_cached_json(\n        connection,\n        _MATCHER_VERSION_CACHE_KEY,\n        {"version": _MATCHER_VERSION},\n        fetched_at=now_iso(),\n        expires_at=None,\n    )\n\n\ndef _stored_image_cache_repair_version(connection: sqlite3.Connection) -> int:\n    payload = get_cached_json(connection, _IMAGE_CACHE_REPAIR_KEY)\n    if not isinstance(payload, dict):\n        return 0\n    try:\n        return int(payload.get("version") or 0)\n    except (TypeError, ValueError):\n        return 0\n\n\ndef _store_image_cache_repair_version(connection: sqlite3.Connection) -> None:\n    put_cached_json(\n        connection,\n        _IMAGE_CACHE_REPAIR_KEY,\n        {"version": _IMAGE_CACHE_REPAIR_VERSION},\n        fetched_at=now_iso(),\n        expires_at=None,\n    )\n\n\ndef _year_similarity'''
          if old not in text:
              raise SystemExit('matcher version anchor not found')
          text = text.replace(old, new, 1)

          old = '''def _cache_candidate_images(\n    work_id: int,\n    candidate: Candidate,\n    image_root: Path,\n    *,\n    image_downloader: Callable[..., Path],\n) -> tuple[bool, bool]:\n    poster_cached = False\n    backdrop_cached = False\n    if candidate.poster_path:\n        target = cached_image_path(image_root, work_id, "poster", candidate.poster_path)\n        if not target.is_file():\n            image_downloader(candidate.poster_path, target, size="w500")\n        poster_cached = target.is_file()\n    if candidate.backdrop_path:\n        target = cached_image_path(image_root, work_id, "backdrop", candidate.backdrop_path)\n        if not target.is_file():\n            image_downloader(candidate.backdrop_path, target, size="w1280")\n        backdrop_cached = target.is_file()\n    return poster_cached, backdrop_cached\n'''
          new = '''def _image_refresh_flags(\n    existing: sqlite3.Row | dict[str, Any] | None,\n    status: str,\n    candidate: Candidate | None,\n) -> tuple[bool, bool]:\n    if status != _MATCHED or candidate is None or existing is None:\n        return False, False\n    old_status = str(existing["match_status"] if isinstance(existing, sqlite3.Row) else existing.get("match_status") or "")\n    old_media_type = str(existing["media_type"] if isinstance(existing, sqlite3.Row) else existing.get("media_type") or "")\n    old_tmdb_id = existing["tmdb_id"] if isinstance(existing, sqlite3.Row) else existing.get("tmdb_id")\n    old_poster = existing["poster_path"] if isinstance(existing, sqlite3.Row) else existing.get("poster_path")\n    old_backdrop = existing["backdrop_path"] if isinstance(existing, sqlite3.Row) else existing.get("backdrop_path")\n    identity_changed = (\n        old_status != _MATCHED\n        or old_media_type != candidate.media_type\n        or int(old_tmdb_id or 0) != candidate.tmdb_id\n    )\n    return (\n        identity_changed or str(old_poster or "") != str(candidate.poster_path or ""),\n        identity_changed or str(old_backdrop or "") != str(candidate.backdrop_path or ""),\n    )\n\n\ndef _cache_candidate_images(\n    work_id: int,\n    candidate: Candidate,\n    image_root: Path,\n    *,\n    image_downloader: Callable[..., Path],\n    force_poster_refresh: bool = False,\n    force_backdrop_refresh: bool = False,\n) -> tuple[bool, bool]:\n    poster_cached = False\n    backdrop_cached = False\n    if candidate.poster_path:\n        target = cached_image_path(image_root, work_id, "poster", candidate.poster_path)\n        if force_poster_refresh and target.is_file():\n            target.unlink()\n        if not target.is_file():\n            image_downloader(candidate.poster_path, target, size="w500")\n        poster_cached = target.is_file()\n    if candidate.backdrop_path:\n        target = cached_image_path(image_root, work_id, "backdrop", candidate.backdrop_path)\n        if force_backdrop_refresh and target.is_file():\n            target.unlink()\n        if not target.is_file():\n            image_downloader(candidate.backdrop_path, target, size="w1280")\n        backdrop_cached = target.is_file()\n    return poster_cached, backdrop_cached\n'''
          if old not in text:
              raise SystemExit('image cache anchor not found')
          text = text.replace(old, new, 1)

          old = '''        total = len(works)\n        stored_version = _stored_matcher_version(connection)\n\n        # v6実機監査でMATCHED 426件を確認済み。v7は監査承認と特殊項目の整理なので、'''
          new = '''        total = len(works)\n        stored_version = _stored_matcher_version(connection)\n        image_cache_repair_version = _stored_image_cache_repair_version(connection)\n        legacy_image_repair = image_cache_repair_version < _IMAGE_CACHE_REPAIR_VERSION\n\n        # v6実機監査でMATCHED 426件を確認済み。v7は監査承認と特殊項目の整理なので、'''
          if old not in text:
              raise SystemExit('sync setup anchor not found')
          text = text.replace(old, new, 1)

          old = '''            poster_cached = False\n            backdrop_cached = False\n            if status == _MATCHED and candidate is not None:\n                try:\n                    poster_cached, backdrop_cached = _cache_candidate_images(\n                        int(work["id"]),\n                        candidate,\n                        image_root_path,\n                        image_downloader=image_downloader,\n                    )\n'''
          new = '''            poster_cached = False\n            backdrop_cached = False\n            if status == _MATCHED and candidate is not None:\n                force_poster_refresh, force_backdrop_refresh = _image_refresh_flags(existing, status, candidate)\n                if legacy_image_repair and _work_audit_key(work) in _LEGACY_STALE_IMAGE_WORKS:\n                    force_poster_refresh = True\n                    force_backdrop_refresh = True\n                try:\n                    poster_cached, backdrop_cached = _cache_candidate_images(\n                        int(work["id"]),\n                        candidate,\n                        image_root_path,\n                        image_downloader=image_downloader,\n                        force_poster_refresh=force_poster_refresh,\n                        force_backdrop_refresh=force_backdrop_refresh,\n                    )\n'''
          if old not in text:
              raise SystemExit('cache call anchor not found')
          text = text.replace(old, new, 1)

          old = '''        _store_matcher_version(connection)\n        connection.commit()\n'''
          new = '''        _store_matcher_version(connection)\n        _store_image_cache_repair_version(connection)\n        connection.commit()\n'''
          if old not in text:
              raise SystemExit('final marker anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          Path('tests/test_tmdb_image_cache_refresh_v110.py').write_text('''from __future__ import annotations\n\nimport sys\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nSRC = ROOT / "windows-installer" / "src"\nsys.path.insert(0, str(SRC))\n\nfrom tmdb_sync import Candidate, _cache_candidate_images, _image_refresh_flags\n\n\ndef candidate(tmdb_id: int = 19616, poster: str = "/new-poster.jpg", backdrop: str = "/new-backdrop.jpg") -> Candidate:\n    return Candidate("tv", tmdb_id, "トリック", "2000", poster, backdrop, "", 1.0, 1.0, 1.0)\n\n\nclass TmdbImageCacheRefreshV110Tests(unittest.TestCase):\n    def test_changed_match_forces_both_images_to_refresh(self):\n        existing = {\n            "match_status": "MATCHED", "media_type": "movie", "tmdb_id": 1812,\n            "poster_path": "/old-poster.jpg", "backdrop_path": "/old-backdrop.jpg",\n        }\n        self.assertEqual(_image_refresh_flags(existing, "MATCHED", candidate()), (True, True))\n\n    def test_unchanged_match_does_not_force_refresh(self):\n        c = candidate()\n        existing = {\n            "match_status": "MATCHED", "media_type": "tv", "tmdb_id": 19616,\n            "poster_path": c.poster_path, "backdrop_path": c.backdrop_path,\n        }\n        self.assertEqual(_image_refresh_flags(existing, "MATCHED", c), (False, False))\n\n    def test_force_refresh_replaces_existing_cached_files(self):\n        c = candidate()\n        calls = []\n        def downloader(remote_path, destination, *, size):\n            calls.append((remote_path, size))\n            Path(destination).parent.mkdir(parents=True, exist_ok=True)\n            Path(destination).write_bytes((remote_path + size).encode("utf-8"))\n            return Path(destination)\n\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            poster = root / "poster" / "112.jpg"\n            backdrop = root / "backdrop" / "112.jpg"\n            poster.parent.mkdir(parents=True)\n            backdrop.parent.mkdir(parents=True)\n            poster.write_bytes(b"wrong poster")\n            backdrop.write_bytes(b"wrong backdrop")\n            result = _cache_candidate_images(\n                112, c, root, image_downloader=downloader,\n                force_poster_refresh=True, force_backdrop_refresh=True,\n            )\n            self.assertEqual(result, (True, True))\n            self.assertEqual(calls, [("/new-poster.jpg", "w500"), ("/new-backdrop.jpg", "w1280")])\n            self.assertNotEqual(poster.read_bytes(), b"wrong poster")\n            self.assertNotEqual(backdrop.read_bytes(), b"wrong backdrop")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          Path('docs/52-1.1.0-tmdb-image-cache-refresh.md').write_text('''# 1.1.0 TMDb画像キャッシュ更新\n\n## 背景\n\nTRICKは過去のmatcherで同名映画へ誤MATCHEDされた時期があり、その後TMDb TV `19616`へ照合を修正した。\nただし画像キャッシュは `workId + 拡張子` で保存し、既存ファイルがあれば再取得しないため、古い別作品のポスターが残るケースがあった。\n\n## 対応\n\n- MATCHEDのTMDb種別・ID・poster_path・backdrop_pathが変化した場合は対応画像を強制再取得する。\n- REVIEW/UNMATCHEDからMATCHEDへ変化した場合も、過去の孤立キャッシュを再利用せず取り直す。\n- 強制更新時は旧キャッシュを削除してからダウンロードする。失敗した場合に誤画像を表示し続けない。\n- 既存インストールのTRICK (`2000-2003`) は一度だけポスター／背景を強制更新する。\n- matcherの判定ロジックと表示バージョン `1.1.0` は変更しない。\n\n## 回帰テスト\n\n`tests/test_tmdb_image_cache_refresh_v110.py` で、照合先変更時の更新判定・変更なし時の非更新・既存画像の強制置換を確認する。\n''', encoding='utf-8')
      - name: Run targeted tests
        run: python -m unittest tests.test_tmdb_image_cache_refresh_v110 tests.test_tmdb_matching_images_v110 tests.test_tmdb_matcher_v7_v110
      - name: Commit product changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-installer/src/tmdb_sync.py tests/test_tmdb_image_cache_refresh_v110.py docs/52-1.1.0-tmdb-image-cache-refresh.md
          git rm .github/workflows/apply-trick-image-cache-fix-114.yml
          git commit -m "1.1.0: TMDb画像キャッシュを照合変更時に更新 (#114)"
          git push
